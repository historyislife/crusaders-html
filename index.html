        function resolveSaracenDefeatChoice(hexKey, hexInfo, continuationMessage) {
            const bonus = hexInfo?.saracenBonus || (hexInfo?.memo || "").replace("【撃破ボーナス】\n", "").trim();

            const canUsePrintedBonus = (() => {
                if (!bonus) return false;
                if (bonus === "軍隊+1") {
                    const army = playerBuildings.find(b => b.name === "軍隊");
                    return !!army?.levels?.[playerResources.buildingsBuilt["軍隊"]];
                }
                const buildingName = bonus.replace("+1", "");
                if (!["城", "教会", "農場", "銀行"].includes(buildingName)) return false;
                if (hexBuildings[hexKey] && hexBuildings[hexKey] !== "空白") return false;
                const building = playerBuildings.find(b => b.name === buildingName);
                return !!building?.levels?.[playerResources.buildingsBuilt[buildingName]];
            })();

            setInteractionMode("none");
            messageEl.style.color = "#fde047";
            messageEl.innerHTML = `サラセン人を撃破しました。撃破ボーナスを選択してください。` +
                `<button id="saracen-choice-vp" style="padding:4px 10px;cursor:pointer;">3勝利点</button>` +
                `<button id="saracen-choice-bonus" style="padding:4px 10px;cursor:pointer;" ${canUsePrintedBonus ? "" : "disabled"}>${bonus || "撃破ボーナスなし"}</button>`;

            document.getElementById("saracen-choice-vp")?.addEventListener("click", () => {
                hideChoiceModal();
                addVictoryPoints(3);
                updateStatusUI();
                continueCombinedAction(`${continuationMessage} 3勝利点を獲得しました。`);
            });

            document.getElementById("saracen-choice-bonus")?.addEventListener("click", () => {
                if (!canUsePrintedBonus) return;
                hideChoiceModal();
                const bonusMessage = executeSaracenDefeatBonus(hexKey, hexInfo);
                updateStatusUI();
                continueCombinedAction(`${continuationMessage}${bonusMessage}`);
            });

            if (botIsExecutingTurn) {
                setTimeout(() => botChooseSaracenReward(hexKey, hexInfo, canUsePrintedBonus, continuationMessage), 0);
            }
        }

                tile.addEventListener("click", () => {

                    } else if (building.name === "銀行") {

                            playerResources.endGameBonuses.bankLevel4Buildings = true;
                            bonusMessage = " ゲーム終了時、レベル4の建物の数だけ4勝利点。";

                    tile.style.opacity = "0.3";

                    hexBuildings[currentKey] = building.name;
                    hexInfo.building = building.name;

                    const cx = playerPosition.c * X_OFFSET;

                    messageEl.textContent = `${building.name} を建設しました！ 勝利点+${lv.p + mapVictoryBonus}${mapVictoryBonus ? `（ボーナスタイル+${mapVictoryBonus}）` : ""}。${bonusMessage}残り建設力: ${availableBuildPoints}`;

        // ==========================================
        // 4. BOT NORMAL（既存ゲーム処理を操作するコントローラ）
        // ==========================================
        const BOT_DEBUG = false;
        const BOT_INFLUENCE_POINT_WEIGHT = 4.5; // 影響アクションの即時得点評価（低め）
        const BOT_THINK_DELAY = 220;
        const BOT_MAX_TURNS = 300;
        let playerController = "human";
        let botIsExecutingTurn = false;
        let botTurnCounter = 0;
        let botCurrentPlan = null;
        let botFlexibleCursor = 0;
        let botActiveSubActionDetail = null;
        let botTurnTimer = null;
        let botFailsafeTimer = null;
        const BOT_FAILSAFE_MS = 2600;
        const botRecentKnightPositions = {};

        function botResetRuntime() {
            botIsExecutingTurn = false;
            botTurnCounter = 0;
            botCurrentPlan = null;
            botFlexibleCursor = 0;
            botActiveSubActionDetail = null;
            if (botTurnTimer) clearTimeout(botTurnTimer);
            botTurnTimer = null;
            if (botFailsafeTimer) clearTimeout(botFailsafeTimer);
            botFailsafeTimer = null;
            Object.keys(botRecentKnightPositions).forEach(k => delete botRecentKnightPositions[k]);
        }

        function armBotFailsafe() {
            if (botFailsafeTimer) clearTimeout(botFailsafeTimer);
            botFailsafeTimer = setTimeout(() => {
                botFailsafeTimer = null;
                if (!botIsExecutingTurn || gameEnded || playerController !== "bot-normal") return;

                botLog("BOTフェイルセーフ：入力待ち状態を検出し自動復帰します");
                hideChoiceModal();
                enhancementInfoPending = false;

                // サラセン選択が残っていれば最優先で解決。
                const saracenVp = document.getElementById("saracen-choice-vp");
                if (saracenVp) {
                    saracenVp.click();
                    return;
                }

                // 分配が止まっている場合は、合法マスへ残りコマを自動配置する。
                if (isDistributingTokens && tokensToDistribute > 0) {
                    let guard = 0;
                    while (isDistributingTokens && tokensToDistribute > 0 && guard++ < 30) {
                        const legal = getDistributionSelectableIndices();
                        if (!legal.length) break;
                        handleWedgeClick(legal[0]);
                    }
                    if (!isDistributingTokens) return;
                    cancelCurrentDistribution();
                    botCompleteTurn("BOT：分配フェイルセーフで手番を終了しました。");
                    return;
                }

                // 移動は残り移動力を捨てて終了できる。
                if (isSelectingMove) {
                    endMoveAction();
                    return;
                }

                // 建設・十字軍・招集のクリック待ちは断念して共通終了処理へ。
                if (isSelectingBuild) {
                    isSelectingBuild = false;
                    selectedBuildKnight = null;
                    clearBuildableHighlights();
                    continueCombinedAction("BOT：建設入力待ちを自動終了しました。", "#f87171");
                    return;
                }
                if (isSelectingCrusade) {
                    isSelectingCrusade = false;
                    clearSelectableHexes();
                    clearKnightActionHighlights();
                    continueCombinedAction("BOT：十字軍入力待ちを自動終了しました。", "#f87171");
                    return;
                }
                if (isSelectingRecruit) {
                    isSelectingRecruit = false;
                    clearRecruitableHighlights();
                    continueCombinedAction("BOT：招集入力待ちを自動終了しました。", "#f87171");
                    return;
                }

                // 複合アクションの選択／数値入力待ちなら、残りを放棄して終了。
                if (flexibleCombinedMode) {
                    finishFlexibleCombinedTurn("BOT：複合アクションの入力待ちを自動終了しました。", "#f87171");
                    return;
                }

                // その他の未知の停止状態でも人間へ手番を返す。
                botCompleteTurn("BOT：停止状態を検出したため手番を自動終了しました。");
            }, BOT_FAILSAFE_MS);
        }

        function botLog(text) {
            // BOTの行動記録は専用欄を作らず、GAME LOGへ統合する。
            appendGameLog(text, "BOT");
            if (BOT_DEBUG) console.log("[BOT]", text);
        }

        renderGameLog();

        function scheduleBotTurn(delay = BOT_THINK_DELAY) {
            if (playerController !== "bot-normal" || gameEnded) return;

            // 対戦状態から位置を復元できる場合は、表示状態の一時的な不整合で停止させない。
            if (!playerPosition && gameMode === "versus" && playerStates[currentPlayerIndex]?.knightPositions?.[1]) {
                const p = playerStates[currentPlayerIndex].knightPositions[1];
                playerPosition = {...p};
                knightPositions[1] = {...p};
            }
            if (!playerPosition) return;

            if (botTurnTimer) clearTimeout(botTurnTimer);
            botTurnTimer = setTimeout(() => {
                botTurnTimer = null;
                botTurn();
            }, delay);
        }

        function botAutoSetup() {
            if (playerController !== "bot-normal") return;
            // NORMALは全騎士団を扱える。現時点では同率ランダムで選択。
            const order = knightOrders[Math.floor(Math.random() * knightOrders.length)];
            botLog(`騎士団：${order}`);
            selectKnightOrder(order);

            // 既存の騎士団セットアップ処理をそのまま呼ぶ。
            if (knightOrderSetupMode === "alcantara-token") {
                const tokenIndex = chooseBotSetupWedge([1, 4, 0, 3, 5, 2]);
                handleKnightOrderSetupWedge(tokenIndex);
                const upgradeIndex = chooseBotSetupWedge([3, 0, 4, 1, 5, 2]);
                handleKnightOrderSetupWedge(upgradeIndex);
            } else if (knightOrderSetupMode === "hospital-token") {
                handleKnightOrderSetupWedge(2);
            } else if (knightOrderSetupMode === "templar-token") {
                handleKnightOrderSetupWedge(2);
                handleKnightOrderSetupWedge(5);
            } else if (knightOrderSetupMode === "avis-token") {
                handleKnightOrderSetupWedge(1);
            } else if (knightOrderSetupMode === "santiago-upgrade") {
                handleKnightOrderSetupWedge(3);
            } else if (knightOrderSetupMode === "lazarus-token") {
                const tokenIndex = chooseBotSetupWedge([2, 5, 1, 4, 0, 3]);
                handleKnightOrderSetupWedge(tokenIndex);
                [3, 0, 4, 1, 5, 2]
                    .filter(i => i !== tokenIndex)
                    .slice(0, 3)
                    .forEach(i => handleKnightOrderSetupWedge(i));
            }

            // 対戦セットアップで後手の人間がスタート位置を選ぶ段階なら、BOTは介入しない。
            if (gameMode === "versus" && versusSetupPhase === "start-position" && playerController === "human") return;

            // 即時セットアップ型は selectKnightOrder 内で startPositionSelection まで進む。
            if (isSelectingStart) {
                const pos = chooseBotStartPosition();
                completeStartPositionSelection(pos.c, pos.r);
            }
        }

        function chooseBotSetupWedge(preference) {
            return preference.find(i => i >= 0 && i < NUM_WEDGES) ?? 0;
        }

        function chooseBotStartPosition() {
            const choices = [{c:1,r:2},{c:1,r:3}];
            const score = pos => {
                let v = 0;
                for (const n of getNeighbors(pos.c, pos.r)) {
                    const info = hexInfos[`${n.c},${n.r}`];
                    if (info?.faction !== "なし") v += 5;
                    if (info?.bonusTileEffects?.length) v += info.bonusTileEffects.length;
                }
                return v + Math.random() * 0.01;
            };
            return choices.sort((a,b) => score(b)-score(a))[0];
        }

        // 人間／BOT共通の「手番で何をするか」の入口。
        // ルール効果そのものは既存の beginNormalDistribution / beginWedgeEnhancement 以下を利用する。
        function executeAction(action) {
            if (!action || gameEnded) return false;
            if (action.controller === "bot") {
                botCurrentPlan = action;
                botIsExecutingTurn = true;
                botFlexibleCursor = 0;
                botActiveSubActionDetail = null;
                armBotFailsafe();
            }

            if (action.type === "wedge-action") {
                beginNormalDistribution(action.wedgeIndex);
                if (action.controller === "bot") {
                    setTimeout(() => botFeedDistribution(action.distributionSequence || []), 0);
                }
                return true;
            }
            if (action.type === "wedge-upgrade") {
                beginWedgeEnhancement(action.wedgeIndex);
                if (action.controller === "bot") {
                    setTimeout(() => {
                        enhancementInfoPending = false;
                        hideChoiceModal();

                        beginEnhancementDistribution(action.distributionSourceIndex);

                        if (!isDistributingTokens) {
                            const fallbackSource = board
                                .map((tokens, i) => ({tokens, i}))
                                .filter(x => x.tokens > 0)
                                .sort((a, b) => b.tokens - a.tokens)[0]?.i;
                            if (fallbackSource !== undefined) {
                                beginEnhancementDistribution(fallbackSource);
                            }
                        }

                        if (isDistributingTokens) {
                            setTimeout(() => botFeedDistribution(action.distributionSequence || []), 0);
                        } else {
                            botLog("ウェッジ強化後の分配開始に失敗");
                            cancelCurrentDistribution();
                            botCompleteTurn("ウェッジ強化分配失敗");
                        }
                    }, 0);
                }
                return true;
            }
            return false;
        }

        function botFeedDistribution(sequence) {
            if (!botIsExecutingTurn || gameEnded || !isDistributingTokens) return;
            const planned = Array.isArray(sequence) ? [...sequence] : [];
            const step = () => {
                if (!botIsExecutingTurn || gameEnded || !isDistributingTokens) return;
                if (tokensToDistribute <= 0) return;
                const legal = getDistributionSelectableIndices();
                if (!legal.length) {
                    botLog("分配候補なし：手番を停止");
                    cancelCurrentDistribution();
                    botCompleteTurn("分配失敗");
                    return;
                }
                let choice = planned.shift();
                if (!legal.includes(choice)) choice = chooseBotLiveDistributionIndex(legal);
                handleWedgeClick(choice);
                if (isDistributingTokens && tokensToDistribute > 0) setTimeout(step, 18);
            };
            step();
        }

        function chooseBotLiveDistributionIndex(legal) {
            let best = legal[0];
            let bestScore = -Infinity;
            for (const i of legal) {
                const label = actions[i] || baseActions[i];
                let score = board[i] * 0.3;
                if (label.includes("十字軍")) score += 3;
                if (label.includes("建設")) score += 2.5;
                if (label.includes("影響")) score += 2;
                if (label.includes("移動")) score += 1.5;
                if (score > bestScore) { bestScore = score; best = i; }
            }
            return best;
        }

        function botTurn() {
            if (!playerPosition && gameMode === "versus" && playerStates[currentPlayerIndex]?.knightPositions?.[1]) {
                const p = playerStates[currentPlayerIndex].knightPositions[1];
                playerPosition = {...p};
                knightPositions[1] = {...p};
            }
            if (playerController !== "bot-normal" || gameEnded || botIsExecutingTurn || !playerPosition) return;
            if (++botTurnCounter > BOT_MAX_TURNS) {
                botLog("安全上限300手に到達。BOTを停止しました。");
                messageEl.style.color = "#f87171";
                messageEl.textContent = "BOTは300手の安全上限に到達したため停止しました。";
                return;
            }

            messageEl.style.color = "#93c5fd";
            messageEl.textContent = `BOT思考中…（${botTurnCounter}手目）`;
            const moves = generateLegalMoves();
            if (!moves.length) {
                botLog("合法手がありません。BOTを停止しました。");
                messageEl.style.color = "#f87171";
                messageEl.textContent = "BOT：合法手がありません。";
                return;
            }
            const evaluated = moves.map(move => ({...move, score: evaluateMove(move)}));
            if (BOT_DEBUG) console.table(evaluated.map(m => ({action:m.label, score:Math.round(m.score*100)/100, wedge:m.wedgeIndex, detail:m.debugDetail||""})));
            const bestScore = Math.max(...evaluated.map(m => m.score));
            const best = evaluated.filter(m => Math.abs(m.score - bestScore) < 1e-9);
            const selected = best[Math.floor(Math.random() * best.length)];
            botLog(`BOT：${selected.label}${selected.allocationLabel ? `（${selected.allocationLabel}）` : ""}`);
            if (selected.actionDetails?.length > 1) {
                selected.actionDetails.forEach(d => d?.log && botLog(d.log));
            } else if (selected.primaryDetail?.log) {
                botLog(selected.primaryDetail.log);
            }
            executeAction({...selected, controller:"bot"});
        }

        function generateLegalMoves() {
            const candidates = [];
            for (let i = 0; i < NUM_WEDGES; i++) {
                const tokens = board[i];
                if (tokens <= 0) continue;
                const dists = generateDistributionVariants(i);
                const distributionVariants = dists.length ? dists : [{sequence:[], finalBoard:[...board], futureScore:0}];

                if (!wedgeUpgraded[i]) {
                    const actionName = baseActions[i];
                    const power = Math.max(0, tokens + getActionBonusValue(actionName));
                    const detail = getBestBotActionDetail(actionName, power, cloneKnightPositions(), new Set());
                    if (detail) {
                        for (const dist of distributionVariants) {
                            candidates.push({
                                type:"wedge-action", wedgeIndex:i, label:actionName,
                                distributionSequence:dist.sequence,
                                primaryDetail:detail,
                                actionDetails:[detail],
                                allocations:[{action:actionName, allocated:tokens, detail}],
                                allocationLabel:`${actionName}${tokens}`,
                                immediateScore:detail.score,
                                distributionFutureScore:dist.futureScore,
                                debugDetail:detail.log || ""
                            });
                        }
                    }
                } else {
                    const list = upgradedActionLists[i];
                    for (let first = 0; first <= tokens; first++) {
                        const allocations = [first, tokens-first];
                        if (allocations[0] === 0 && allocations[1] === 0) continue;
                        const plan = buildBotCombinedPlan(list, allocations);
                        if (!plan) continue;
                        for (const dist of distributionVariants) {
                            candidates.push({
                                type:"wedge-action", wedgeIndex:i, label:actions[i],
                                distributionSequence:dist.sequence,
                                allocations:plan.allocations,
                                actionDetails:plan.details,
                                primaryDetail:plan.details.find(Boolean) || null,
                                allocationLabel:plan.allocations.filter(x=>x.allocated>0).map(x=>`${x.action}${x.allocated}`).join(" / "),
                                immediateScore:plan.score,
                                distributionFutureScore:dist.futureScore,
                                debugDetail:plan.details.filter(Boolean).map(d=>d.log).join(" → ")
                            });
                        }
                    }
                }
            }

            // ウェッジ強化候補。強化対象と分配元までを一つの合法手として持つ。
            for (let target = 0; target < NUM_WEDGES; target++) {
                if (wedgeUpgraded[target]) continue;
                for (let source = 0; source < NUM_WEDGES; source++) {
                    if (board[source] <= 0) continue;
                    for (const dist of generateDistributionVariants(source)) {
                        candidates.push({
                            type:"wedge-upgrade", wedgeIndex:target,
                            distributionSourceIndex:source,
                            distributionSequence:dist.sequence,
                            label:`${baseActions[target]}→${upgradedActionLabels[target]}へ強化`,
                            immediateScore:getBotUpgradeValue(target),
                            distributionFutureScore:dist.futureScore,
                            allocationLabel:`分配元 ${actions[source]}`,
                            debugDetail:`強化:${target} 分配:${source}`
                        });
                    }
                }
            }
            return candidates;
        }

        function buildBotCombinedPlan(actionList, allocatedCounts) {
            let positions = cloneKnightPositions();
            const removedEnemyKeys = new Set();
            const allocations = [];
            const details = [];
            let totalScore = 0;
            for (let j = 0; j < actionList.length; j++) {
                const action = actionList[j];
                const allocated = allocatedCounts[j];
                if (allocated <= 0) {
                    allocations.push({action, allocated:0, detail:null});
                    details.push(null);
                    continue;
                }
                const power = Math.max(0, allocated + getActionBonusValue(action));
                const detail = getBestBotActionDetail(action, power, positions, removedEnemyKeys);
                if (!detail) return null;
                allocations.push({action, allocated, detail});
                details.push(detail);
                totalScore += detail.score;
                if (action === "移動" && detail.positionsAfter) positions = detail.positionsAfter;
                if (action === "十字軍" && detail.targetKey) removedEnemyKeys.add(detail.targetKey);
            }
            return {allocations, details, score:totalScore};
        }

        function getBestBotActionDetail(action, power, positions, removedEnemyKeys) {
            if (power < 0) return null;
            let options = [];
            if (action === "移動") options = getBotMoveOptions(power, positions);
            else if (action === "建設") options = getBotBuildOptions(power, positions, removedEnemyKeys);
            else if (action === "十字軍") options = getBotCrusadeOptions(power, positions, removedEnemyKeys);
            else if (action === "招集") options = getBotRecruitOptions(power);
            else if (action === "影響") options = power > 0 ? [{score:power*BOT_INFLUENCE_POINT_WEIGHT, vpGain:power, usedPower:power, log:`影響力で${power}点獲得`}]:[];
            if (!options.length) return null;
            const bestScore = Math.max(...options.map(o=>o.score));
            const best = options.filter(o=>Math.abs(o.score-bestScore)<1e-9);
            return best[Math.floor(Math.random()*best.length)];
        }

        function cloneKnightPositions() {
            const out = {};
            Object.entries(knightPositions).forEach(([k,v]) => out[k] = v ? {...v} : null);
            return out;
        }

        function getBotBuildOptions(power, positions, removedEnemyKeys = new Set()) {
            const options = [];
            for (const [numberText, pos] of Object.entries(positions)) {
                if (!pos) continue;
                const number = Number(numberText);
                const key = `${pos.c},${pos.r}`;
                if (hexBuildings[key] && hexBuildings[key] !== "空白") continue;
                const info = hexInfos[key];
                if (info?.faction !== "なし" && !removedEnemyKeys.has(key)) continue;
                for (const building of playerBuildings) {
                    if (building.name === "軍隊") continue;
                    const idx = playerResources.buildingsBuilt[building.name];
                    const lv = building.levels[idx];
                    if (!lv) continue;
                    const cost = getFinalBuildCost(lv.c, info, building.name);
                    if (power < cost) continue;
                    const vp = lv.p + getBuildVictoryPointBonus(info, building.name) + (building.name === "教会" && idx === 3 ? 6 : 0);
                    let engineValue = 0;
                    // 建設は即時VPだけでなく、以後の恒久ボーナスと盤面支配を生むため高めに評価する。
                    if (building.name === "銀行") engineValue = idx < 3 ? 15 : 8;
                    if (building.name === "農場") engineValue = idx < 3 ? 14 : 7;
                    if (building.name === "教会") engineValue = idx < 3 ? 13 : 10;
                    if (building.name === "城") engineValue = idx < 3 ? 12 : 9;

                    const earlyBuildBonus = playerResources.buildingsBuilt[building.name] < 2 ? 4 : 0;
                    const mapBonusValue = getBuildVictoryPointBonus(info, building.name) * 3;
                    const score =
                        vp * 9
                        + engineValue
                        + earlyBuildBonus
                        + mapBonusValue
                        + pos.c * 0.8
                        - Math.max(0, power - cost) * 0.25;
                    options.push({score, knight:number, buildingName:building.name, levelIndex:idx, targetKey:key, cost, vpGain:vp, usedPower:cost,
                        log:`騎士${number}：${building.name}Lv${idx+1}を建設候補（必要${cost}、即時${vp}点）`});
                }
            }
            return options;
        }

        function getBotCrusadeOptions(power, positions, removedEnemyKeys = new Set()) {
            const options = [];
            for (const [numberText, pos] of Object.entries(positions)) {
                if (!pos) continue;
                const number = Number(numberText);
                const key = `${pos.c},${pos.r}`;
                if (removedEnemyKeys.has(key)) continue;
                const info = hexInfos[key];
                if (!info || info.faction === "なし") continue;
                const strength = getEnemyStrength(info.faction);
                if (power < strength) continue;
                const expectedVp = info.faction === "サラセン人" ? getBotSaracenExpectedValue(key, info) : strength;
                const score = expectedVp*10 + strength*1.2 + pos.c*0.7 + (info.faction === "サラセン人" ? 5 : 0) - Math.max(0,power-strength)*0.35;
                options.push({score, knight:number, enemyType:info.faction, targetKey:key, strength, vpGain:expectedVp, usedPower:strength,
                    log:`騎士${number}：${info.faction}を十字軍候補（戦力${strength}）`});
            }
            return options;
        }

        function getBotRecruitOptions(power) {
            const army = playerBuildings.find(b=>b.name === "軍隊");
            const idx = playerResources.buildingsBuilt["軍隊"];
            const lv = army?.levels?.[idx];
            if (!lv || power < lv.c) return [];
            return [{score:lv.p*10 + 8 - Math.max(0,power-lv.c)*0.4, levelIndex:idx, cost:lv.c, vpGain:lv.p, usedPower:lv.c,
                log:`軍隊Lv${idx+1}を招集（必要${lv.c}、${lv.p}点、軍事力+1）`}];
        }

        function getBotMoveOptions(power, positions) {
            if (power <= 0) return [];
            const singles = [];
            for (const [numberText, start] of Object.entries(positions)) {
                if (!start) continue;
                const number = Number(numberText);
                const queue = [{pos:{...start}, cost:0, path:[]}];
                const bestCost = new Map([[`${start.c},${start.r}`,0]]);
                while (queue.length) {
                    const cur = queue.shift();
                    if (cur.cost > 0) {
                        const key = `${cur.pos.c},${cur.pos.r}`;
                        const info = hexInfos[key];
                        let positionValue = cur.pos.c*0.8;
                        if (info?.faction !== "なし") positionValue += 11;
                        if (info?.faction === "サラセン人") positionValue += 2;
                        if ((!hexBuildings[key] || hexBuildings[key] === "空白") && info?.faction === "なし") {
                            positionValue += 7; // 次ターンの建設候補地
                            const hasFutureBuild = playerBuildings.some(building => {
                                if (building.name === "軍隊") return false;
                                const idx = playerResources.buildingsBuilt[building.name];
                                const lv = building.levels[idx];
                                if (!lv) return false;
                                const expectedPower = Math.max(1, board[1] || 0) + getActionBonusValue("建設");
                                return expectedPower >= getFinalBuildCost(lv.c, info, building.name);
                            });
                            if (hasFutureBuild) positionValue += 5;
                        }
                        if (info?.bonusTileEffects?.length) positionValue += 2.0*info.bonusTileEffects.length;
                        const recent = botRecentKnightPositions[number];
                        if (recent && recent.c === cur.pos.c && recent.r === cur.pos.r) positionValue -= 7;
                        singles.push({number, path:cur.path, cost:cur.cost, target:{...cur.pos}, score:positionValue*2 - cur.cost*0.4});
                    }
                    const curInfo = hexInfos[`${cur.pos.c},${cur.pos.r}`];
                    const stepCost = curInfo?.faction !== "なし" ? 2 : 1;
                    for (const n of getNeighbors(cur.pos.c, cur.pos.r)) {
                        const nc = cur.cost + stepCost;
                        if (nc > power) continue;
                        const key = `${n.c},${n.r}`;
                        if ((bestCost.get(key) ?? Infinity) <= nc) continue;
                        bestCost.set(key,nc);
                        queue.push({pos:{...n}, cost:nc, path:[...cur.path,{...n}]});
                    }
                }
            }
            singles.sort((a,b)=>b.score-a.score);
            const topSingles = singles.slice(0,10).map(m => {
                const positionsAfter = clonePositionsObject(positions);
                positionsAfter[m.number] = {...m.target};
                return {score:m.score, moves:[m], usedPower:m.cost, positionsAfter,
                    log:`騎士${m.number}を${m.target.c+1}列${m.target.r+1}段へ移動（${m.cost}）`};
            });

            // 複数騎士への移動力振り分けも候補にする。
            const byKnight = {};
            for (const m of singles) (byKnight[m.number] ||= []).push(m);
            const nums = Object.keys(byKnight).map(Number);
            const combos = [];
            for (let a=0;a<nums.length;a++) for (let b=a+1;b<nums.length;b++) {
                for (const ma of byKnight[nums[a]].slice(0,3)) for (const mb of byKnight[nums[b]].slice(0,3)) {
                    if (ma.cost + mb.cost > power) continue;
                    const positionsAfter = clonePositionsObject(positions);
                    positionsAfter[ma.number] = {...ma.target};
                    positionsAfter[mb.number] = {...mb.target};
                    combos.push({score:ma.score+mb.score+1.5, moves:[ma,mb], usedPower:ma.cost+mb.cost, positionsAfter,
                        log:`騎士${ma.number}と騎士${mb.number}へ移動力を分配`});
                }
            }
            return [...topSingles, ...combos].sort((a,b)=>b.score-a.score).slice(0,14);
        }

        function clonePositionsObject(positions) {
            const out={};
            Object.entries(positions).forEach(([k,v])=>out[k]=v?{...v}:null);
            return out;
        }

        function getBotSaracenExpectedValue(hexKey, hexInfo) {
            let value = 3;
            const bonus = hexInfo?.saracenBonus || (hexInfo?.memo || "").replace("【撃破ボーナス】\\n", "").trim();
            if (bonus === "軍隊+1") {
                const army = playerBuildings.find(b=>b.name==="軍隊");
                const lv = army?.levels?.[playerResources.buildingsBuilt["軍隊"]];
                if (lv) value = Math.max(value, lv.p + 2.5);
            } else if (bonus) {
                const buildingName = bonus.replace("+1","");
                const building = playerBuildings.find(b=>b.name===buildingName);
                const idx = playerResources.buildingsBuilt[buildingName];
                const lv = building?.levels?.[idx];
                if (lv && (!hexBuildings[hexKey] || hexBuildings[hexKey] === "空白")) {
                    value = Math.max(value, lv.p + getBuildVictoryPointBonus(hexInfo, buildingName) + 2);
                }
            }
            return value;
        }

        function getBotUpgradeValue(index) {
            const list = upgradedActionLists[index];
            const weights = {"移動":3.5,"建設":8,"招集":4,"十字軍":5,"影響":2.5};
            return 8 + list.reduce((a,x)=>a+(weights[x]||2),0) + board[index]*0.4;
        }

        const BOT_MOST_TOKENS_WEDGE_BONUS = 12; // 最多コマのウェッジを優先する評価ボーナス

        function getMostPopulatedWedgeTokenCount() {
            return Math.max(...board);
        }

        function evaluateMove(move) {
            let score = move.immediateScore || 0;
            score += (move.distributionFutureScore || 0) * 0.8;

            // 現在もっともコマが多いウェッジのアクションを優先する。
            // 同数最多が複数ある場合は、そのすべてを同じように優遇する。
            const maxTokens = getMostPopulatedWedgeTokenCount();
            if (move.wedgeIndex != null && board[move.wedgeIndex] === maxTokens && maxTokens > 0) {
                score += BOT_MOST_TOKENS_WEDGE_BONUS;
            }

            // BOT NORMALは建設を戦略の中核として適度に優先する。
            const allocations = move.allocations || move.actionPlan?.allocations || [];
            if (allocations.some(a => a?.action === "建設" && a?.allocated > 0 && a?.detail)) {
                score += 8;
            }

            if (move.type === "wedge-upgrade") score -= 4; // 即時得点を捨てる機会費用
            return score + Math.random()*0.0001;
        }

        function makeDistributionSimulationState(sourceIndex) {
            const order = selectedKnightOrder;
            const direction = order === "テューダー騎士団" ? 0 : 1;
            const sourceStart = order === "アヴィス騎士団" || order === "サンティアゴ騎士団";
            return {
                order,
                sourceIndex,
                direction,
                sourceStartChoicePending:sourceStart,
                nextIndex:direction === 0 ? null : (sourceIndex + direction + NUM_WEDGES)%NUM_WEDGES,
                specialUsed:false,
                templarRepeatIndex:null,
                tokensRemaining:board[sourceIndex],
                board:[...board],
                sequence:[]
            };
        }

        function advanceDistributionSimulation(state, index) {
            const next = {
                ...state,
                board:[...state.board],
                sequence:[...state.sequence,index]
            };
            const savedNextIndex = next.nextIndex;
            const tokensBefore = next.tokensRemaining;
            if (next.order === "テューダー騎士団" && next.direction === 0) {
                const left=(next.sourceIndex-1+NUM_WEDGES)%NUM_WEDGES;
                next.direction = index === left ? -1 : 1;
            }
            if (next.order === "ホスピタル騎士団" && !next.specialUsed && next.nextIndex !== null && index !== next.nextIndex) next.specialUsed=true;
            const templarRepeat = next.order === "テンプル騎士団" && !next.specialUsed && next.templarRepeatIndex !== null && index === next.templarRepeatIndex && index !== next.nextIndex;
            next.board[index]++;
            next.tokensRemaining--;
            if (next.sourceStartChoicePending) next.sourceStartChoicePending=false;
            if (templarRepeat) {
                next.specialUsed=true;
                next.templarRepeatIndex=null;
                next.nextIndex = next.tokensRemaining>0 ? savedNextIndex : null;
            } else {
                next.nextIndex = next.tokensRemaining>0 ? (index+next.direction+NUM_WEDGES)%NUM_WEDGES : null;
                next.templarRepeatIndex = next.order === "テンプル騎士団" && !next.specialUsed && tokensBefore>=2 && next.tokensRemaining>0 ? index : null;
            }
            return next;
        }

        function generateDistributionVariants(sourceIndex) {
            if (board[sourceIndex] <= 0) return [];
            const initial = makeDistributionSimulationState(sourceIndex);
            initial.board[sourceIndex]=0;
            const results=[];
            const walk = state => {
                if (results.length >= 64) return;
                if (state.tokensRemaining <= 0) {
                    results.push({sequence:state.sequence, finalBoard:state.board, futureScore:evaluateDistributionBoard(state.board)});
                    return;
                }
                const legal=getDistributionSelectableIndicesForState(state);
                for (const idx of legal) walk(advanceDistributionSimulation(state,idx));
            };
            walk(initial);
            // 同じ最終盤面は最良の1件だけ残す。
            const unique=new Map();
            for (const r of results) {
                const k=r.finalBoard.join(',');
                if (!unique.has(k) || unique.get(k).futureScore<r.futureScore) unique.set(k,r);
            }
            return [...unique.values()].sort((a,b)=>b.futureScore-a.futureScore).slice(0,12);
        }

        function evaluateDistributionBoard(testBoard) {
            let value=0;
            for (let i=0;i<NUM_WEDGES;i++) {
                const count=testBoard[i];
                const list=wedgeUpgraded[i]?upgradedActionLists[i]:[baseActions[i]];
                let weight=0;
                for (const action of list) {
                    if (action === "十字軍") weight += 2.8;
                    else if (action === "建設") weight += 2.6;
                    else if (action === "影響") weight += 2.1;
                    else if (action === "招集") weight += 2.0;
                    else if (action === "移動") weight += 1.8;
                }
                value += count*weight;
                if (count >= 3) value += 1.2;
                if (count >= 6) value -= (count-5)*0.7;
            }
            return value;
        }

        function botDriveFlexibleChooser() {
            if (!botIsExecutingTurn || !botCurrentPlan || !flexibleCombinedMode || gameEnded) return;
            if (currentFlexibleAction) return;
            const queue = botCurrentPlan.allocations || [];
            while (botFlexibleCursor < queue.length && queue[botFlexibleCursor].allocated <= 0) botFlexibleCursor++;
            if (botFlexibleCursor >= queue.length) {
                document.getElementById("finish-flex-action")?.click();
                return;
            }
            const item = queue[botFlexibleCursor++];
            botActiveSubActionDetail = item.detail || null;
            const actionBtn = [...document.querySelectorAll(".flex-action-choice")].find(btn=>btn.dataset.action===item.action);
            if (!actionBtn) {
                setTimeout(botDriveFlexibleChooser,0);
                return;
            }
            actionBtn.click();
            setTimeout(() => {
                const numberBtn = [...document.querySelectorAll(".flex-base-spend-number")].find(btn=>Number(btn.dataset.value)===item.allocated);
                if (numberBtn) numberBtn.click();
                else {
                    botLog(`${item.action}の割当${item.allocated}を実行できないため、この複合アクションを終了`);
                    document.getElementById("flex-base-spend-cancel")?.click();
                    setTimeout(()=>document.getElementById("finish-flex-action")?.click(),0);
                }
            },0);
        }

        function botResolvePendingAction(actionName) {
            if (!botIsExecutingTurn || gameEnded) return;
            const detail = flexibleCombinedMode ? botActiveSubActionDetail : (botCurrentPlan?.primaryDetail || botCurrentPlan?.actionDetails?.[0]);
            if (actionName === "移動") {
                botExecuteMoveDetail(detail);
            } else if (actionName === "建設") {
                if (!isSelectingBuild) return;
                if (!detail?.knight || !detail?.buildingName) {
                    isSelectingBuild=false; clearBuildableHighlights(); continueCombinedAction("BOT：建設候補なし。"); return;
                }
                handleKnightClick(detail.knight);
                const idx=playerResources.buildingsBuilt[detail.buildingName];
                buildingTileElements[detail.buildingName]?.[idx]?.click();
                if (isSelectingBuild) {
                    isSelectingBuild=false; selectedBuildKnight=null; clearBuildableHighlights(); continueCombinedAction("BOT：建設を実行できませんでした。", "#f87171");
                }
            } else if (actionName === "十字軍") {
                if (!isSelectingCrusade) return;

                const getLegalCrusadeKnights = () => Object.entries(knightPositions)
                    .filter(([, pos]) => {
                        if (!pos) return false;
                        const info = hexInfos[`${pos.c},${pos.r}`];
                        return !!info && info.faction !== "なし" && getEnemyStrength(info.faction) <= availableCrusadePoints;
                    })
                    .map(([number]) => Number(number));

                const legalBefore = getLegalCrusadeKnights();
                const plannedKnight = Number(detail?.knight);
                const firstChoice = legalBefore.includes(plannedKnight) ? plannedKnight : legalBefore[0];

                if (!firstChoice) {
                    isSelectingCrusade = false;
                    clearSelectableHexes();
                    clearKnightActionHighlights();
                    continueCombinedAction("BOT：十字軍対象が不成立になったため終了します。", "#f87171");
                    return;
                }

                handleKnightClick(firstChoice);

                // 実行時点で対象が変化していた場合は、残っている合法対象を1回だけ再探索。
                if (isSelectingCrusade) {
                    const fallback = getLegalCrusadeKnights().find(n => n !== firstChoice);
                    if (fallback) handleKnightClick(fallback);
                }

                if (isSelectingCrusade) {
                    isSelectingCrusade = false;
                    clearSelectableHexes();
                    clearKnightActionHighlights();
                    continueCombinedAction("BOT：十字軍を実行できなかったため、このアクションを終了します。", "#f87171");
                }
            } else if (actionName === "招集") {
                if (!isSelectingRecruit) return;
                const idx=playerResources.buildingsBuilt["軍隊"];
                buildingTileElements["軍隊"]?.[idx]?.click();
                if (isSelectingRecruit) { isSelectingRecruit=false; clearRecruitableHighlights(); continueCombinedAction("BOT：招集を実行できませんでした。", "#f87171"); }
            }
        }

        function botExecuteMoveDetail(detail) {
            if (!isSelectingMove) return;
            const moves=detail?.moves || [];
            for (const move of moves) {
                const before=knightPositions[move.number]?{...knightPositions[move.number]}:null;
                if (before) botRecentKnightPositions[move.number]=before;
                for (const step of move.path || []) {
                    if (!isSelectingMove || remainingMovePoints<=0) break;
                    handleKnightClick(move.number);
                    const key=`${step.c},${step.r}`;
                    const poly=hexGroups[key]?.querySelector("polygon");
                    if (!poly?.classList.contains("selectable")) break;
                    hexGroups[key].dispatchEvent(new MouseEvent("click",{bubbles:true}));
                }
            }
            if (isSelectingMove) endMoveAction();
        }

        function botChooseSaracenReward(hexKey, hexInfo, canUsePrintedBonus, continuationMessage = "BOTがサラセン人を撃破しました。") {
            if (!botIsExecutingTurn) return;
            const printed = canUsePrintedBonus ? getBotSaracenExpectedValue(hexKey,hexInfo) : -Infinity;
            const choosePrinted = canUsePrintedBonus && printed > 3.15;

            if (choosePrinted) {
                botLog(`サラセン撃破：${hexInfo?.saracenBonus || "印刷ボーナス"}を選択`);
                const btn = document.getElementById("saracen-choice-bonus");
                if (btn && !btn.disabled) {
                    btn.click();
                    return;
                }
                // DOMボタンが生成されなかった場合も、共通効果関数で直接解決する。
                const bonusMessage = executeSaracenDefeatBonus(hexKey, hexInfo);
                updateStatusUI();
                continueCombinedAction(`${continuationMessage}${bonusMessage}`);
                return;
            }

            botLog("サラセン撃破：3勝利点を選択");
            const vpBtn = document.getElementById("saracen-choice-vp");
            if (vpBtn) {
                vpBtn.click();
                return;
            }
            // DOMボタンがない場合のフェイルセーフ。
            addVictoryPoints(3);
            updateStatusUI();
            continueCombinedAction(`${continuationMessage} 3勝利点を獲得しました。`);
        }

        function botCompleteTurn(message="") {
            if (!botIsExecutingTurn) return;
            if (botFailsafeTimer) clearTimeout(botFailsafeTimer);
            botFailsafeTimer = null;
            botIsExecutingTurn=false;
            botCurrentPlan=null;
            botFlexibleCursor=0;
            botActiveSubActionDetail=null;
            hideChoiceModal();
            if (message && BOT_DEBUG) console.log("[BOT TURN END]",message);
            if (gameMode === "versus" && !gameEnded) {
                completeCurrentTurn(message);
            } else if (!gameEnded && playerController === "bot-normal") {
                scheduleBotTurn();
            }
        }


    </script>
</body>
