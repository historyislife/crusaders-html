        function handleKnightOrderSetupWedge(index) {
            if (knightOrderSetupMode === "alcantara-token") {
                board[index] = 3;
                updateWheelUI();
                knightOrderSetupSelections = [index];
                knightOrderSetupMode = "alcantara-upgrade";
                wedgeElements.forEach(w => w.classList.remove("active"));
                wedgeElements[index].classList.add("active");
                messageEl.textContent = "アルカンタラ騎士団：強化した状態で開始するホイールのマスを1つ選択してください。";
                return true;
            }
            if (knightOrderSetupMode === "alcantara-upgrade") {
                wedgeUpgraded[index] = true;
                actions[index] = upgradedActionLabels[index];
                if (actionTextElements[index]) actionTextElements[index].textContent = actions[index];
                wedgeElements.forEach(w => w.classList.remove("active"));
                wedgeElements[index].classList.add("active");
                startPositionSelection();
                return true;
            }
            if (knightOrderSetupMode === "hospital-token") {
                board[index] = 1;
                updateWheelUI();
                wedgeElements.forEach(w => w.classList.remove("active"));
                wedgeElements[index].classList.add("active");
                startPositionSelection();
                return true;
            }
            if (knightOrderSetupMode === "lazarus-token") {
                board[index] = 1;
                knightOrderSetupSelections = [index];
                updateWheelUI();
                wedgeElements.forEach(w => w.classList.remove("active"));
                wedgeElements[index].classList.add("active");
                knightOrderSetupMode = "lazarus-upgrade";
                messageEl.textContent = "聖ラザロ騎士団：強化するウェッジを3つ選択してください（1つ目）。";
                return true;
            }
            if (knightOrderSetupMode === "lazarus-upgrade") {
                if (knightOrderSetupSelections.includes(index)) {
                    messageEl.style.color = "#f87171";
                    messageEl.textContent = "同じウェッジは選択できません。別のウェッジを選択してください。";
                    return true;
                }
                wedgeUpgraded[index] = true;
                actions[index] = upgradedActionLabels[index];
                if (actionTextElements[index]) actionTextElements[index].textContent = actions[index];
                knightOrderSetupSelections.push(index);
                wedgeElements[index].classList.add("active");
                const selectedUpgrades = knightOrderSetupSelections.length - 1;
                if (selectedUpgrades < 3) {
                    messageEl.style.color = "#facc15";
                    messageEl.textContent = `聖ラザロ騎士団：強化するウェッジを3つ選択してください（${selectedUpgrades + 1}つ目）。`;
                } else {
                    startPositionSelection();
                }
                return true;
            }
            if (knightOrderSetupMode === "templar-token") {
                if (knightOrderSetupSelections.includes(index)) {
                    messageEl.style.color = "#f87171";
                    messageEl.textContent = "同じマスは選択できません。別のホイールマスを選択してください。";
                    return true;
                }
                board[index] = 1;
                knightOrderSetupSelections.push(index);
                updateWheelUI();
                wedgeElements[index].classList.add("active");
                if (knightOrderSetupSelections.length < 2) {
                    messageEl.style.color = "#facc15";
                    messageEl.textContent = "テンプル騎士団：コマを1個にする2つ目のホイールマスを選択してください。";
                } else {
                    startPositionSelection();
                }
                return true;
            }
            if (knightOrderSetupMode === "avis-token") {
                board[index] = 3;
                updateWheelUI();
                wedgeElements.forEach(w => w.classList.remove("active"));
                wedgeElements[index].classList.add("active");
                startPositionSelection();
                return true;
            }
            if (knightOrderSetupMode === "santiago-upgrade") {
                wedgeUpgraded[index] = true;
                actions[index] = upgradedActionLabels[index];
                if (actionTextElements[index]) actionTextElements[index].textContent = actions[index];
                wedgeElements.forEach(w => w.classList.remove("active"));
                wedgeElements[index].classList.add("active");
                startPositionSelection();
                return true;
            }
            return false;
        }

        function resetMapForNewGame() {
            globalDefeated = { "サラセン人": 0, "プロイセン人": 0, "スラブ人": 0 };
            // 騎士・建物表示を除去
            if (playerTokenElement) {
                playerTokenElement.remove();
                playerTokenElement = null;
            }
            Object.values(extraKnightByNumber).forEach(el => el?.remove());
            extraKnightTokenElements.length = 0;
            delete extraKnightByNumber[2];
            delete extraKnightByNumber[3];
            delete extraKnightByNumber[4];
            knightPositions[1] = null;
            knightPositions[2] = null;
            knightPositions[3] = null;
            knightPositions[4] = null;
            playerPosition = null;
            selectedMoveKnight = null;
            selectedBuildKnight = null;
            document.querySelectorAll(".map-building-label").forEach(el => el.remove());

            // ボーナスタイルを再シャッフル
            const newAssignments = createMapBonusTileAssignments();

            // 異教徒とサラセン人撃破ボーナスを再シャッフル
            enemyList.sort(() => Math.random() - 0.5);
            saracenBonuses.sort(() => Math.random() - 0.5);
            let resetEnemyIndex = 0;
            let resetSaracenIndex = 0;

            Object.entries(hexGroups).forEach(([key, group]) => {
                const [col, row] = key.split(",").map(Number);
                const info = hexInfos[key];

                group.querySelectorAll(".enemy-token, .enemy-label, .bonus-tile-marker, .fixed-bonus-star, .bonus-band").forEach(el => el.remove());
                info.building = "空白";
                info.memo = "";
                info.bonus = fixedBonuses[key] || "なし";
                info.bonusTileEffects = newAssignments[key] ? [...newAssignments[key]] : [];
                info.bonusTiles = getMapBonusTileCount(col, row);

                const cx = col * X_OFFSET;
                let cy = row * Y_OFFSET;
                if (col % 2 !== 0) cy += Y_OFFSET / 2;

                renderHexBonusBands(group, cx, cy, info);

                if (col >= 3) {
                    const enemyType = enemyList[resetEnemyIndex++];
                    info.faction = enemyType;
                    info.affiliation = enemyType;
                    const circle = document.createElementNS(SVG_NS, "circle");
                    circle.setAttribute("cx", cx);
                    circle.setAttribute("cy", cy);
                    circle.setAttribute("r", 13);
                    circle.style.pointerEvents = "none";
                    circle.classList.add("enemy-token");

                    const text = document.createElementNS(SVG_NS, "text");
                    text.setAttribute("x", cx);
                    text.setAttribute("y", cy + 4);
                    text.setAttribute("font-size", "12px");
                    text.setAttribute("font-weight", "bold");
                    text.setAttribute("text-anchor", "middle");
                    text.style.pointerEvents = "none";
                    text.classList.add("enemy-label");

                    if (enemyType === "サラセン人") {
                        circle.setAttribute("fill", "#eab308");
                        text.setAttribute("fill", "#000");
                        text.textContent = "サ";
                        const bonus = saracenBonuses[resetSaracenIndex++];
                        info.memo = `【撃破ボーナス】\n${bonus}`;
                    } else if (enemyType === "プロイセン人") {
                        circle.setAttribute("fill", "#3b82f6");
                        text.setAttribute("fill", "#fff");
                        text.textContent = "プ";
                    } else {
                        circle.setAttribute("fill", "#ef4444");
                        text.setAttribute("fill", "#fff");
                        text.textContent = "ス";
                    }
                    group.appendChild(circle);
                    group.appendChild(text);
                } else {
                    info.faction = "なし";
                    info.affiliation = "なし";
                }
                updateHexAffiliationVisual(key);
            });
        }

        function clearActiveKnightDom() {
            if (playerTokenElement) { playerTokenElement.remove(); playerTokenElement = null; }
            Object.keys(extraKnightByNumber).forEach(k => {
                extraKnightByNumber[k]?.remove();
                delete extraKnightByNumber[k];
            });
            extraKnightTokenElements.splice(0, extraKnightTokenElements.length);
        }

        function renderInactivePlayerKnights() {
            if (inactiveKnightLayer) inactiveKnightLayer.remove();
            if (gameMode !== "versus") return;
            const other = playerStates[1-currentPlayerIndex];
            if (!other) return;
            inactiveKnightLayer = document.createElementNS(SVG_NS, "g");
            inactiveKnightLayer.style.pointerEvents = "none";
            const fill = other.controller === "bot-normal" ? "#020617" : "#22c55e";
            Object.entries(other.knightPositions || {}).forEach(([num,pos]) => {
                if (!pos) return;
                let cx=pos.c*X_OFFSET, cy=pos.r*Y_OFFSET;
                if (pos.c%2!==0) cy+=Y_OFFSET/2;
                const c=document.createElementNS(SVG_NS,"circle");
                c.setAttribute("cx",cx); c.setAttribute("cy",cy); c.setAttribute("r",9);
                c.setAttribute("fill", Number(num)===4 ? "#111827" : fill);
                c.setAttribute("stroke", other.controller === "bot-normal" ? "#94a3b8" : "#ffffff");
                c.setAttribute("stroke-width","2"); c.setAttribute("opacity","0.82");
                inactiveKnightLayer.appendChild(c);
            });
            mapGroup.appendChild(inactiveKnightLayer);
        }

        function refreshCurrentPlayerBoardTiles() {
            Object.entries(buildingTileElements).forEach(([name, tiles]) => {
                const built = playerResources.buildingsBuilt[name] || 0;
                tiles.forEach((tile, i) => {
                    tile.style.opacity = i < built ? "0.3" : "1";
                    tile.style.pointerEvents = i < built ? "none" : "auto";
                    tile.classList.remove("build-selectable","recruit-selectable");
                });
            });
        }

        function loadPlayerState(index) {
            if (gameMode !== "versus" || !playerStates[index]) return;
            // 通常手番へ入る時に騎士団セットアップ状態を持ち越さない。
            knightOrderSetupMode = null;
            knightOrderSetupSelections = [];
            clearActiveKnightDom();
            currentPlayerIndex=index;
            const st=playerStates[index];
            playerController=st.controller;
            playerResources=structuredClone(st.resources);
            board=[...st.board];
            wedgeUpgraded=[...st.wedgeUpgraded];
            actions=[...st.actions];
            selectedKnightOrder=st.selectedKnightOrder;
            Object.keys(knightPositions).forEach(k => knightPositions[k]=st.knightPositions?.[k] ? {...st.knightPositions[k]} : null);
            playerPosition=knightPositions[1] ? {...knightPositions[1]} : null;
            actionTextElements.forEach((el,i)=>{ if(el) el.textContent=actions[i]; });
            updateWheelUI();
            refreshCurrentPlayerBoardTiles();
            if (knightPositions[1]) setPlayerPosition(knightPositions[1].c, knightPositions[1].r);
            [2,3,4].forEach(n=>{ const p=st.knightPositions?.[n]; if(p) placeExtraKnightToken(p.c,p.r,n); });
            renderInactivePlayerKnights();
            updateStatusUI();
            botResetRuntime();
        }

        function resetGlobalsForPlayerSetup(controller) {
            clearActiveKnightDom();
            playerController=controller;
            playerResources=createDefaultResources();
            board=Array(NUM_WEDGES).fill(2);
            wedgeUpgraded=Array(NUM_WEDGES).fill(false);
            actions=[...baseActions];
            selectedKnightOrder=null;
            Object.keys(knightPositions).forEach(k=>knightPositions[k]=null);
            playerPosition=null;
            actionTextElements.forEach((el,i)=>{ if(el) el.textContent=actions[i]; });
            updateWheelUI();
            refreshCurrentPlayerBoardTiles();
            updateStatusUI();
        }

        function saveSetupStateFor(index) {
            playerStates[index].resources=structuredClone(playerResources);
            playerStates[index].board=[...board];
            playerStates[index].wedgeUpgraded=[...wedgeUpgraded];
            playerStates[index].actions=[...actions];
            playerStates[index].selectedKnightOrder=selectedKnightOrder;
            playerStates[index].knightPositions={1:null,2:null,3:null,4:null};
        }

        function startCurrentPlayerTurn(delay = 180) {
            if (gameMode !== "versus" || gameEnded || !playerStates[currentPlayerIndex]) return;

            const st = playerStates[currentPlayerIndex];
            if (st.controller === "bot-normal") {
                setInteractionMode("none");
                messageEl.style.color = "#93c5fd";
                messageEl.textContent = "BOT思考中…";

                // 通常起動
                scheduleBotTurn(delay);

                // UI更新や状態切替でタイマーが消えた場合の保険。
                setTimeout(() => {
                    if (
                        gameMode === "versus"
                        && !gameEnded
                        && playerController === "bot-normal"
                        && !botIsExecutingTurn
                        && !botTurnTimer
                        && playerPosition
                    ) {
                        scheduleBotTurn(0);
                    }
                }, Math.max(700, delay + 400));
            } else {
                setInteractionMode("all");
                messageEl.style.color = "#4ade80";
                messageEl.textContent = `${st.name}の手番です。`;
            }
        }

        function completeCurrentTurn(message="") {
            if (gameMode !== "versus" || gameEnded) return;
            snapshotCurrentPlayerState();
            const next=1-currentPlayerIndex;
            loadPlayerState(next);
            startCurrentPlayerTurn(180);
        }


        const wheelSvg = document.getElementById("wheel-svg");
        const wheelRadius = 90;
        const wedgeElements = [];
        const textElements = [];
        const actionTextElements = [];
        const cubeLayer = document.createElementNS(SVG_NS, "g");
        cubeLayer.classList.add("mancala-cube-layer");

        function getWheelCoords(angleDeg, rad) {
            const r = (angleDeg - 90) * Math.PI / 180;
            return { x: rad * Math.cos(r), y: rad * Math.sin(r) };
        }

        for (let i = 0; i < NUM_WEDGES; i++) {
            const startAngle = i * 60 - 30;
            const endAngle = (i + 1) * 60 - 30;
            const p1 = getWheelCoords(startAngle, wheelRadius);
            const p2 = getWheelCoords(endAngle, wheelRadius);

            const path = document.createElementNS(SVG_NS, "path");
            path.setAttribute("d", `M 0 0 L ${p1.x} ${p1.y} L ${p2.x} ${p2.y} Z`);
            path.classList.add("wedge");
            path.addEventListener("click", () => handleWedgeClick(i));
            wheelSvg.appendChild(path);
            wedgeElements.push(path);

            const midAngle = startAngle + 30;
            const txtPos = getWheelCoords(midAngle, wheelRadius * 0.68);
            const numPos = getWheelCoords(midAngle, wheelRadius * 0.40);

            const actionText = document.createElementNS(SVG_NS, "text");
            actionText.setAttribute("x", txtPos.x);
            actionText.setAttribute("y", txtPos.y + 4);
            actionText.classList.add("wedge-text");
            actionText.textContent = actions[i];
            wheelSvg.appendChild(actionText);
            actionTextElements.push(actionText);

            const numText = document.createElementNS(SVG_NS, "text");
            numText.setAttribute("x", numPos.x);
            numText.setAttribute("y", numPos.y);
            numText.classList.add("token-count");
            numText.textContent = board[i];
            wheelSvg.appendChild(numText);
            textElements.push(numText);
        }
        wheelSvg.appendChild(cubeLayer);

        function createMancalaCube(x, y, size = 6, floating = false) {
            const outer = document.createElementNS(SVG_NS, "g");
            outer.setAttribute("transform", `translate(${x} ${y})`);
            outer.classList.add("mancala-cube");
            if (floating) outer.classList.add("floating");

            const body = document.createElementNS(SVG_NS, "g");
            body.classList.add("cube-body");

            const top = document.createElementNS(SVG_NS, "polygon");
            top.classList.add("cube-top");
            top.setAttribute("points", `0,${-size} ${size},${-size/2} 0,0 ${-size},${-size/2}`);

            const left = document.createElementNS(SVG_NS, "polygon");
            left.classList.add("cube-left");
            left.setAttribute("points", `${-size},${-size/2} 0,0 0,${size} ${-size},${size/2}`);

            const right = document.createElementNS(SVG_NS, "polygon");
            right.classList.add("cube-right");
            right.setAttribute("points", `0,0 ${size},${-size/2} ${size},${size/2} 0,${size}`);

            body.appendChild(top);
            body.appendChild(left);
            body.appendChild(right);
            outer.appendChild(body);
            return outer;
        }

        function renderMancalaCubes() {
            cubeLayer.innerHTML = "";
            for (let i = 0; i < NUM_WEDGES; i++) {
                const midAngle = i * 60;
                const base = getWheelCoords(midAngle, wheelRadius * 0.54);
                const tangent = (midAngle) * Math.PI / 180;
                const nx = Math.cos(tangent);
                const ny = Math.sin(tangent);
                const visibleCount = board[i];
                for (let j = 0; j < visibleCount; j++) {
                    const offset = (j - (visibleCount - 1) / 2) * 11;
                    const x = base.x + nx * offset;
                    const y = base.y + ny * offset;
                    cubeLayer.appendChild(createMancalaCube(x, y, 5.5, false));
                }
            }

            if (isDistributingTokens && distributingSourceIndex !== null && tokensToDistribute > 0) {
                const midAngle = distributingSourceIndex * 60;
                const base = getWheelCoords(midAngle, wheelRadius * 0.54);
                const tangent = (midAngle) * Math.PI / 180;
                const nx = Math.cos(tangent);
                const ny = Math.sin(tangent);
                for (let j = 0; j < tokensToDistribute; j++) {
                    const offset = (j - (tokensToDistribute - 1) / 2) * 11;
                    const x = base.x + nx * offset;
                    const y = base.y + ny * offset;
                    cubeLayer.appendChild(createMancalaCube(x, y, 5.5, true));
                }
            }
        }

        let isSelectingMove = false;
        let remainingMovePoints = 0;

        let isSelectingBuild = false;
        let availableBuildPoints = 0;

        let isSelectingCrusade = false;
        let availableCrusadePoints = 0;

        let isSelectingRecruit = false;
        let availableRecruitPoints = 0;

        let isDistributingTokens = false;
        let distributingSourceIndex = null;
        let distributingActionTokens = 0;
        let tokensToDistribute = 0;
        let distributionNextIndex = null;
        let pendingWedgeChoiceIndex = null;
        let isEnhancingWedge = false;
        let enhancingWedgeIndex = null;
        let enhancementAwaitingSource = false;
        let enhancementInfoPending = false;
        let distributionSkipsAction = false;
        let distributionOriginalBoard = null;
        let distributionTransactionSnapshot = null;
        let pendingCombinedActions = [];
        let pendingCombinedTokens = 0;
        let flexibleCombinedMode = false;
        let flexibleCombinedActions = [];
        let flexibleBasePoints = 0;
        let flexibleBonusRemaining = {};
        let currentFlexibleAction = null;
        let currentFlexibleStartAvailable = 0;
        let buildUsedThisTurn = false;
        let crusadeUsedThisTurn = false;

        const wheelContainer = document.getElementById("wheel-container");
        const wheelDragHandle = document.getElementById("wheel-drag-handle");
        const mapSectionEl = document.getElementById("map-section");
        const boardContainerEl = document.getElementById("board-container");

        function setInteractionMode(mode) {
            const mapEnabled = mode === "all" || mode === "map" || mode === "map-board";
            const boardEnabled = mode === "all" || mode === "board" || mode === "map-board";

            mapSectionEl.classList.toggle("interaction-locked", !mapEnabled);
            boardContainerEl.classList.toggle("interaction-locked", !boardEnabled);

            // 選択肢ウインドウは、現在操作する固定ウインドウを避ける。
            choiceModal.classList.remove("avoid-map", "avoid-board");
            if (mode === "map") {
                choiceModal.classList.add("avoid-map");
            } else if (mode === "board") {
                choiceModal.classList.add("avoid-board");
            }

            // 前面表示：マップ／ボード選択時だけ対象ウインドウをホイールより前へ。
            // それ以外はアクションホイールを常に最前面にする。
            mapSectionEl.classList.remove("window-front");
            boardContainerEl.classList.remove("window-front");
            wheelContainer.classList.remove("window-front");

            if (mode === "map") {
                mapSectionEl.classList.add("window-front");
            } else if (mode === "board") {
                boardContainerEl.classList.add("window-front");
            } else if (mode === "map-board") {
                mapSectionEl.classList.add("window-front");
                boardContainerEl.classList.add("window-front");
            } else {
                wheelContainer.classList.add("window-front");
            }
        }

        function keepWheelOnScreen() {
            const rect = wheelContainer.getBoundingClientRect();
            let left = rect.left;
            let top = rect.top;
            left = Math.max(0, Math.min(left, window.innerWidth - rect.width));
            top = Math.max(0, Math.min(top, window.innerHeight - rect.height));
            wheelContainer.style.left = left + "px";
            wheelContainer.style.top = top + "px";
            wheelContainer.style.transform = "none";
        }

        (function enableWheelDragging() {
            let dragging = false;
            let offsetX = 0;
            let offsetY = 0;

            wheelDragHandle.addEventListener("pointerdown", (e) => {
                dragging = true;
                const rect = wheelContainer.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                wheelContainer.style.left = rect.left + "px";
                wheelContainer.style.top = rect.top + "px";
                wheelContainer.style.right = "auto";
                wheelContainer.style.bottom = "auto";
                wheelContainer.style.width = rect.width + "px";
                wheelContainer.style.transform = "none";
                wheelDragHandle.setPointerCapture(e.pointerId);
                e.preventDefault();
            });

            wheelDragHandle.addEventListener("pointermove", (e) => {
                if (!dragging) return;
                const maxLeft = Math.max(0, window.innerWidth - wheelContainer.offsetWidth);
                const maxTop = Math.max(0, window.innerHeight - wheelContainer.offsetHeight);
                const left = Math.max(0, Math.min(e.clientX - offsetX, maxLeft));
                const top = Math.max(0, Math.min(e.clientY - offsetY, maxTop));
                wheelContainer.style.left = left + "px";
                wheelContainer.style.top = top + "px";
            });

            const stopDrag = (e) => {
                dragging = false;
                if (e && wheelDragHandle.hasPointerCapture(e.pointerId)) {
                    wheelDragHandle.releasePointerCapture(e.pointerId);
                }
            };
            wheelDragHandle.addEventListener("pointerup", stopDrag);
            wheelDragHandle.addEventListener("pointercancel", stopDrag);
            window.addEventListener("resize", keepWheelOnScreen);
            window.addEventListener("orientationchange", () => setTimeout(keepWheelOnScreen, 50));
        })();

        wheelContainer.classList.add("window-front");

        function clearDistributionHighlights() {
            wedgeElements.forEach(w => {
                w.classList.remove("distribution-selectable", "distribution-disabled");
            });
        }

        function getDistributionSelectableIndicesForState(state) {
            if (!state || state.tokensRemaining <= 0) return [];
            const order = state.order;
            const sourceIndex = state.sourceIndex;
            const direction = state.direction;

            // ドイツ（旧表記テューダー）：最初の1個は左右どちらにも置ける。
            if (order === "テューダー騎士団" && direction === 0) {
                return [
                    (sourceIndex - 1 + NUM_WEDGES) % NUM_WEDGES,
                    (sourceIndex + 1) % NUM_WEDGES
                ];
            }

            // アヴィス／サンティアゴ：最初の1個だけ使用ウェッジ自身も候補。
            if (state.sourceStartChoicePending && (order === "アヴィス騎士団" || order === "サンティアゴ騎士団")) {
                return [sourceIndex, (sourceIndex + 1) % NUM_WEDGES];
            }

            if (state.nextIndex === null || state.nextIndex === undefined) return [];
            const result = [state.nextIndex];

            if (order === "ホスピタル騎士団" && !state.specialUsed) {
                result.push((state.nextIndex + direction + NUM_WEDGES) % NUM_WEDGES);
            }

            if (order === "テンプル騎士団" && !state.specialUsed && state.templarRepeatIndex !== null && state.templarRepeatIndex !== undefined) {
                result.push(state.templarRepeatIndex);
            }
            return [...new Set(result)];
        }

        function getDistributionSelectableIndices() {
            return getDistributionSelectableIndicesForState({
                order: selectedKnightOrder,
                sourceIndex: distributingSourceIndex,
                direction: distributionDirection,
                sourceStartChoicePending: distributionSourceStartChoicePending,
                nextIndex: distributionNextIndex,
                specialUsed: distributionSpecialUsed,
                templarRepeatIndex,
                tokensRemaining: tokensToDistribute
            });
        }

        function updateDistributionHighlights() {
            clearDistributionHighlights();
            const selectable = getDistributionSelectableIndices();
            if (!selectable.length) return;
            wedgeElements.forEach((w, i) => {
                if (selectable.includes(i)) {
                    w.classList.add("distribution-selectable");
                } else {
                    w.classList.add("distribution-disabled");
                }
            });
        }

        function canStartDistributionOnSource() {
            return selectedKnightOrder === "アヴィス騎士団" || selectedKnightOrder === "サンティアゴ騎士団";
        }

        function showWedgeChoice(index) {
            pendingWedgeChoiceIndex = index;
            wedgeElements.forEach(w => w.classList.remove('active'));
            wedgeElements[index].classList.add('active');
            setInteractionMode("none");
            const upgradeDisabled = wedgeUpgraded[index] ? "disabled" : "";
            const currentLabel = actions[index];
            const upgradePreview = wedgeUpgraded[index]
                ? "このウェッジはすでに強化済みです。"
                : `強化すると「${baseActions[index]} → ${upgradedActionLabels[index]}」になります。`;

            messageEl.style.color = "#facc15";
            messageEl.innerHTML =
                `<div style="font-weight:700;margin-bottom:6px;">${currentLabel} を選択しました。</div>` +
                `<div style="font-size:.86rem;color:#cbd5e1;margin-bottom:8px;">${upgradePreview}</div>` +
                `<button id="execute-wedge-action" style="margin-left:8px;padding:4px 10px;cursor:pointer;">アクション実行</button>` +
                `<button id="upgrade-wedge-action" ${upgradeDisabled} style="margin-left:6px;padding:4px 10px;cursor:pointer;">ウェッジの強化</button>` +
                `<button id="cancel-wedge-choice" style="margin-left:6px;padding:4px 10px;cursor:pointer;">キャンセル</button>`;
            document.getElementById("execute-wedge-action").addEventListener("click", () => {
                const selected = pendingWedgeChoiceIndex;
                pendingWedgeChoiceIndex = null;
                executeAction({ type: "wedge-action", wedgeIndex: selected, controller: "human" });
            });
            document.getElementById("cancel-wedge-choice").addEventListener("click", () => {
                pendingWedgeChoiceIndex = null;
                wedgeElements.forEach(w => w.classList.remove('active'));
                setInteractionMode("all");
                messageEl.style.color = "#cbd5e1";
                messageEl.textContent = "選択をキャンセルしました。";
            });
            const upBtn = document.getElementById("upgrade-wedge-action");
            if (!wedgeUpgraded[index]) {
                upBtn.addEventListener("click", () => {
                    const selected = pendingWedgeChoiceIndex;
                    pendingWedgeChoiceIndex = null;
                    executeAction({ type: "wedge-upgrade", wedgeIndex: selected, controller: "human" });
                });
            }
        }

        function captureDistributionTransaction() {
            distributionTransactionSnapshot = {
                board: [...board],
                wedgeUpgraded: [...wedgeUpgraded],
                actions: [...actions]
            };
            distributionOriginalBoard = [...board];
        }

        function restoreDistributionTransaction() {
            if (!distributionTransactionSnapshot) return;
            board = [...distributionTransactionSnapshot.board];
            for (let i = 0; i < NUM_WEDGES; i++) {
                wedgeUpgraded[i] = distributionTransactionSnapshot.wedgeUpgraded[i];
                actions[i] = distributionTransactionSnapshot.actions[i];
                if (actionTextElements[i]) actionTextElements[i].textContent = actions[i];
            }
            distributionOriginalBoard = null;
            distributionTransactionSnapshot = null;
            updateWheelUI();
        }

        function beginNormalDistribution(index) {
            buildUsedThisTurn = false;
            crusadeUsedThisTurn = false;
            if ((selectedKnightOrder === "テューダー騎士団")) {
                // 最初の配置先を左右どちらかから選び、その後は選んだ方向へ固定。
                beginNormalDistributionCore(index, 0, false);
                return;
            }
            if (canStartDistributionOnSource()) {
                beginNormalDistributionCore(index, 1, false, true);
                return;
            }
            beginNormalDistributionCore(index, 1, false);
        }

        function beginNormalDistributionCore(index, direction, startOnSource = false, allowSourceFirstChoice = false) {
            const tokens = board[index];
            if (tokens === 0) {
                setInteractionMode("all");
                messageEl.style.color = "#f87171";
                messageEl.textContent = "そのマスには駒がありません！";
                return;
            }
            distributionDirection = direction;
            distributionSpecialUsed = false;
            distributionSourceStartChoicePending = allowSourceFirstChoice;
            templarRepeatIndex = null;
            distributionSkipsAction = false;
            captureDistributionTransaction();
            distributingSourceIndex = index;
            distributingActionTokens = tokens;
            tokensToDistribute = tokens;
            isDistributingTokens = true;
            setInteractionMode("none");
            board[index] = 0;
            distributionNextIndex = distributionDirection === 0
                ? null
                : (startOnSource ? index : (index + distributionDirection + NUM_WEDGES) % NUM_WEDGES);
            updateWheelUI();
            wedgeElements.forEach(w => w.classList.remove('active'));
            wedgeElements[index].classList.add('active');
            updateDistributionHighlights();
            renderDistributionMessage(`${actions[index]} のコマ${tokens}個を取りました。`);
        }

        function renderDistributionMessage(prefix = "") {
            messageEl.style.color = "#facc15";
            let extra = "";
            const sourceChoiceNote = distributionSourceStartChoicePending && canStartDistributionOnSource()
                ? "最初の配置先を、強調された2か所から選んでください。"
                : `残り${tokensToDistribute}個。強調されたホイールマスに配置してください。`;
            messageEl.innerHTML = `${prefix}${prefix ? " " : ""}${sourceChoiceNote}` + extra +
                `<button id="cancel-current-distribution" style="margin-left:8px;padding:4px 10px;cursor:pointer;">キャンセル</button>`;
            const cancel = document.getElementById("cancel-current-distribution");
            if (cancel) cancel.addEventListener("click", cancelCurrentDistribution);
        }

        function beginWedgeEnhancement(index) {
            buildUsedThisTurn = false;
            crusadeUsedThisTurn = false;
            captureDistributionTransaction();
            wedgeUpgraded[index] = true;
            actions[index] = upgradedActionLabels[index];
            if (actionTextElements[index]) actionTextElements[index].textContent = actions[index];
            isEnhancingWedge = true;
            enhancingWedgeIndex = index;
            enhancementAwaitingSource = true;
            enhancementInfoPending = true;
            distributionSkipsAction = true;
            wedgeElements.forEach(w => w.classList.remove('active'));
            wedgeElements[index].classList.add('active');
            setInteractionMode("none");

            const upgradedList = upgradedActionLists[index] || [];
            const upgradedSpec = upgradedList.length === 2
                ? `${upgradedList[0]}＋${upgradedList[1]}`
                : actions[index];

            messageEl.style.color = "#facc15";
            messageEl.innerHTML =
                `<strong>${actions[index]} に強化しました。</strong><br>` +
                `今後このウェッジでは「${upgradedSpec}」の2種類のアクションへコマを振り分けられます。<br>` +
                `各アクションは1個以上コマを割り当てた場合のみ実行できます。<br>` +
                `<button id="confirm-enhancement-info" style="margin-top:8px;padding:5px 12px;cursor:pointer;">OK</button>` +
                `<button id="cancel-current-enhancement" style="margin-left:6px;padding:5px 12px;cursor:pointer;">キャンセル</button>`;

            document.getElementById("confirm-enhancement-info")?.addEventListener("click", () => {
                enhancementInfoPending = false;
                hideChoiceModal();
                messageEl.style.color = "#facc15";
                messageEl.innerHTML =
                    `${actions[index]} に強化しました。このターンはアクションを行いません。` +
                    `コマを分配する元のホイールマスを選択してください。` +
                    `<button id="cancel-current-enhancement" style="margin-left:8px;padding:4px 10px;cursor:pointer;">キャンセル</button>`;
                document.getElementById("cancel-current-enhancement")?.addEventListener("click", cancelCurrentDistribution);
            });
            document.getElementById("cancel-current-enhancement")?.addEventListener("click", () => {
                enhancementInfoPending = false;
                cancelCurrentDistribution();
            });
        }

        function beginEnhancementDistribution(sourceIndex) {
            if (enhancementInfoPending) return;
            const tokens = board[sourceIndex];
            if (tokens === 0) {
                messageEl.style.color = "#f87171";
                messageEl.textContent = "そのマスには駒がありません。コマのあるマスを選択してください。";
                return;
            }

            if ((selectedKnightOrder === "テューダー騎士団")) {
                enhancementAwaitingSource = false;
                // 強化ターンでも最初の配置先を左右どちらかから選び、その後はその方向へ固定。
                beginEnhancementDistributionCore(sourceIndex, 0, false);
                return;
            }

            if (canStartDistributionOnSource()) {
                enhancementAwaitingSource = false;
                beginEnhancementDistributionCore(sourceIndex, 1, false, true);
                return;
            }

            beginEnhancementDistributionCore(sourceIndex, 1, false);
        }

        function beginEnhancementDistributionCore(sourceIndex, direction, startOnSource = false, allowSourceFirstChoice = false) {
            const tokens = board[sourceIndex];
            enhancementAwaitingSource = false;
            distributingSourceIndex = sourceIndex;
            distributingActionTokens = 0;
            tokensToDistribute = tokens;
            isDistributingTokens = true;
            distributionDirection = direction;
            distributionSpecialUsed = false;
            distributionSourceStartChoicePending = allowSourceFirstChoice;
            templarRepeatIndex = null;
            board[sourceIndex] = 0;
            distributionNextIndex = distributionDirection === 0
                ? null
                : (startOnSource ? sourceIndex : (sourceIndex + distributionDirection + NUM_WEDGES) % NUM_WEDGES);
            updateWheelUI();
            wedgeElements.forEach(w => w.classList.remove('active'));
            wedgeElements[sourceIndex].classList.add('active');
            updateDistributionHighlights();
            renderDistributionMessage(`強化ターン：${actions[sourceIndex]} のコマ${tokens}個を取りました。`);
        }

        function finishTokenDistribution() {
            const sourceIndex = distributingSourceIndex;
            const actionTokens = distributingActionTokens;
            const skipAction = distributionSkipsAction;
            isDistributingTokens = false;
            distributingSourceIndex = null;
            distributingActionTokens = 0;
            distributionNextIndex = null;
            clearDistributionHighlights();
            distributionSkipsAction = false;
            distributionOriginalBoard = null;
            distributionTransactionSnapshot = null;
            distributionDirection = 1;
            distributionSpecialUsed = false;
            distributionSourceStartChoicePending = false;
            templarRepeatIndex = null;
            wedgeElements.forEach(w => w.classList.remove('active'));

            if (skipAction) {
                isEnhancingWedge = false;
                enhancingWedgeIndex = null;
                setInteractionMode("all");
                messageEl.style.color = "#4ade80";
                messageEl.textContent = "ウェッジの強化とコマの分配が完了しました。このターンのアクションは行いません。";
                if (botIsExecutingTurn) setTimeout(() => botCompleteTurn("ウェッジ強化完了"), 0);
                else if (gameMode === "versus") setTimeout(() => completeCurrentTurn("ウェッジ強化完了"), 0);
            } else {
                resolveSelectedActionSequence(sourceIndex, actionTokens);
            }
        }

        function cancelCurrentDistribution() {
            // 分配開始前の盤面・ウェッジ状態を丸ごと復元する。
            // これにより途中まで置いたコマも、強化したウェッジも確実に元へ戻る。
            restoreDistributionTransaction();

            isDistributingTokens = false;
            distributingSourceIndex = null;
            distributingActionTokens = 0;
            tokensToDistribute = 0;
            distributionNextIndex = null;
            distributionDirection = 1;
            distributionSpecialUsed = false;
            distributionSourceStartChoicePending = false;
            templarRepeatIndex = null;
            clearDistributionHighlights();
            distributionSkipsAction = false;
            isEnhancingWedge = false;
            enhancingWedgeIndex = null;
            enhancementAwaitingSource = false;
            pendingWedgeChoiceIndex = null;
            wedgeElements.forEach(w => w.classList.remove('active'));
            setInteractionMode("all");
            messageEl.style.color = "#cbd5e1";
            messageEl.textContent = "キャンセルしました。";
        }

        function getActionBonusValue(actionName) {
            let bonus = 0;
            if (actionName === "移動") bonus = playerResources.bonuses.move;
            else if (actionName === "建設") bonus = playerResources.bonuses.build;
            else if (actionName === "招集") bonus = playerResources.bonuses.recruit;
            else if (actionName === "十字軍") bonus = playerResources.bonuses.military;
            else if (actionName === "影響") bonus = playerResources.bonuses.influence;

            if (selectedKnightOrder === "聖墳墓騎士団" && actionName === "移動") bonus -= 1;
            if (selectedKnightOrder === "モンテサ騎士団" && actionName === "移動") bonus += 1;
            if (selectedKnightOrder === "カラトラバ騎士団") bonus += 1;
            return bonus;
        }

        function getCurrentFlexibleRemaining() {
            if (currentFlexibleAction === "移動") return remainingMovePoints;
            if (currentFlexibleAction === "建設") return availableBuildPoints;
            if (currentFlexibleAction === "招集") return availableRecruitPoints;
            if (currentFlexibleAction === "十字軍") return availableCrusadePoints;
            return 0;
        }

        function settleFlexibleSpentPoints(remainingAvailable) {
            // 強化ウェッジでは、ホイールのコマはアクション開始前に割り当てて消費する。
            // ボーナスや未使用のアクション力だけで別アクションを実行することはできない。
            currentFlexibleAction = null;
            currentFlexibleStartAvailable = 0;
        }

        function finishFlexibleCombinedTurn(finalMessage = "複合アクションを終了しました。", color = "#4ade80") {
            flexibleCombinedMode = false;
            flexibleCombinedActions = [];
            flexibleBasePoints = 0;
            flexibleBonusRemaining = {};
            currentFlexibleAction = null;
            currentFlexibleStartAvailable = 0;
            pendingCombinedActions = [];
            pendingCombinedTokens = 0;
            isSelectingMove = false;
            isSelectingBuild = false;
            isSelectingRecruit = false;
            isSelectingCrusade = false;
            selectedMoveKnight = null;
            selectedBuildKnight = null;
            clearSelectableHexes();
            clearBuildableHighlights();
            clearRecruitableHighlights();
            setInteractionMode("all");
            messageEl.style.color = color;
            messageEl.textContent = finalMessage;
            if (botIsExecutingTurn) setTimeout(() => botCompleteTurn(finalMessage), 0);
            else if (gameMode === "versus") setTimeout(() => completeCurrentTurn(finalMessage), 0);
        }

        function showFlexibleCombinedChooser(prefix = "") {
            setInteractionMode("none");
            if (flexibleBasePoints <= 0) {
                finishFlexibleCombinedTurn(prefix || "割り当て可能なホイールコマがなくなりました。");
                return;
            }
            const usableActions = flexibleCombinedActions.filter(action => {
                if (action === "建設" && buildUsedThisTurn) return false;
                if (action === "十字軍" && crusadeUsedThisTurn) return false;
                return true;
            });
            if (usableActions.length === 0) {
                finishFlexibleCombinedTurn(prefix || "このターンに実行できるアクションがありません。");
                return;
            }
            messageEl.style.color = "#facc15";
            const buttons = usableActions.map(action =>
                `<button class="flex-action-choice" data-action="${action}" style="padding:4px 10px;cursor:pointer;">${action}</button>`
            ).join("");
            messageEl.innerHTML = `${prefix ? prefix + " " : ""}残りホイールコマ: ${flexibleBasePoints}。実行するアクションを選択してください。${buttons}` +
                `<button id="finish-flex-action" style="padding:4px 10px;cursor:pointer;">アクション終了</button>`;
            messageEl.querySelectorAll(".flex-action-choice").forEach(btn => {
                btn.addEventListener("click", () => startFlexibleSubAction(btn.dataset.action));
            });
            document.getElementById("finish-flex-action").addEventListener("click", () => {
                finishFlexibleCombinedTurn("複合アクションを終了しました。");
            });
            if (botIsExecutingTurn) {
                armBotFailsafe();
                setTimeout(botDriveFlexibleChooser, 0);
            }
        }

        function getBuildBonusEffectTexts(hexInfo) {
            const texts = [];
            if (!hexInfo) return texts;
            if (hexInfo.bonus) texts.push(hexInfo.bonus);
            if (Array.isArray(hexInfo.bonusTileEffects)) texts.push(...hexInfo.bonusTileEffects);
            return texts.filter(Boolean);
        }

        function effectAppliesToBuilding(effectText, buildingName, keyword) {
            if (!effectText || !buildingName || !keyword) return false;
            const parts = String(effectText).split(/OR|＆/);
            let inheritedBuildings = [];

            for (const rawPart of parts) {
                const part = rawPart.trim();
                if (!part) continue;

                const namedBuildings = ["城", "教会", "農場", "銀行"].filter(name => part.includes(name));
                if (namedBuildings.length > 0) inheritedBuildings = namedBuildings;

                if (!part.includes(keyword)) continue;
                const targets = namedBuildings.length > 0 ? namedBuildings : inheritedBuildings;
                if (targets.includes(buildingName)) return true;
            }
            return false;
        }

        function getBuildCostReduction(hexInfo, buildingName) {
            let reduction = 0;
            for (const text of getBuildBonusEffectTexts(hexInfo)) {
                if (effectAppliesToBuilding(text, buildingName, "コスト-2")) reduction += 2;
                else if (effectAppliesToBuilding(text, buildingName, "コスト-1")) reduction += 1;
                else if (text.includes("城、教会、農場、銀行コスト-1") && ["城","教会","農場","銀行"].includes(buildingName)) reduction += 1;
            }
            return reduction;
        }

        function getBuildVictoryPointBonus(hexInfo, buildingName) {
            let bonus = 0;
            for (const text of getBuildBonusEffectTexts(hexInfo)) {
                if (effectAppliesToBuilding(text, buildingName, "勝利点+2")) bonus += 2;
                else if (effectAppliesToBuilding(text, buildingName, "勝利点+1")) bonus += 1;
            }
            return bonus;
        }

        function getFinalBuildCost(baseCost, hexInfo, buildingName) {
            return Math.max(0, baseCost - getBuildCostReduction(hexInfo, buildingName));
        }

        function getMinimumBuildCostForCurrentState() {
            let minCost = Infinity;
            Object.values(knightPositions).forEach(pos => {
                if (!pos) return;
                const key = `${pos.c},${pos.r}`;
                if (hexBuildings[key] && hexBuildings[key] !== "空白") return;
                const hexInfo = hexInfos[key];
                if (hexInfo && hexInfo.faction !== "なし") return;

                playerBuildings.forEach(building => {
                    if (building.name === "軍隊") return;
                    const currentBuiltCount = playerResources.buildingsBuilt[building.name];
                    const lv = building.levels[currentBuiltCount];
                    if (!lv) return;
                    const finalCost = getFinalBuildCost(lv.c, hexInfo, building.name);
                    minCost = Math.min(minCost, finalCost);
                });
            });
            return Number.isFinite(minCost) ? minCost : null;
        }

        function getMinimumCrusadeCostForCurrentState() {
            let minCost = Infinity;
            Object.values(knightPositions).forEach(pos => {
                if (!pos) return;
                const info = hexInfos[`${pos.c},${pos.r}`];
                if (!info || info.faction === "なし") return;
                minCost = Math.min(minCost, getEnemyStrength(info.faction));
            });
            return Number.isFinite(minCost) ? minCost : null;
        }

        function showInsufficientAllocationMessage(actionName, allocated, bonus, required) {
            setInteractionMode("none");
            messageEl.style.color = "#f87171";
            const effective = allocated + bonus;
            const requiredText = required == null ? "実行可能な対象なし" : `必要コスト ${required}`;

            // BOTは人間用の「やり直す／戻る」ボタンを待たない。
            if (botIsExecutingTurn) {
                botLog(`${actionName}：割当${allocated}＋ボーナス${bonus}では不足（${requiredText}）。この候補をスキップ`);
                botActiveSubActionDetail = null;
                setTimeout(() => showFlexibleCombinedChooser(`BOT：${actionName}は実行できないためスキップしました。`), 0);
                return;
            }

            messageEl.innerHTML = `${actionName}にコマ${allocated}個＋ボーナス${bonus}＝${effective}を割り当てましたが、コストが足りません（${requiredText}）。` +
                `<button id="retry-flex-allocation" style="padding:4px 10px;cursor:pointer;">割り当てをやり直す</button>` +
                `<button id="back-flex-action" style="padding:4px 10px;cursor:pointer;">アクション選択へ戻る</button>`;
            document.getElementById("retry-flex-allocation").addEventListener("click", () => showFlexibleAllocationChooser(actionName));
            document.getElementById("back-flex-action").addEventListener("click", () => showFlexibleCombinedChooser());
        }

        function showFlexibleAllocationChooser(actionName) {
            if (actionName === "建設" && buildUsedThisTurn) {
                showFlexibleCombinedChooser("建設は1ターンに1回のみ実行できます。");
                return;
            }
            if (actionName === "十字軍" && crusadeUsedThisTurn) {
                showFlexibleCombinedChooser("十字軍は1ターンに1回のみ実行できます。");
                return;
            }
            if (flexibleBasePoints <= 0) {
                showFlexibleCombinedChooser("割り当て可能なホイールコマがありません。");
                return;
            }
            setInteractionMode("none");
            const bonus = getActionBonusValue(actionName);
            messageEl.style.color = "#facc15";

            const numberButtons = Array.from({ length: flexibleBasePoints }, (_, i) => i + 1)
                .map(value => `<button class="flex-base-spend-number" data-value="${value}" style="padding:4px 10px;cursor:pointer;">${value}</button>`)
                .join("");

            messageEl.innerHTML = `${actionName}に割り当てるホイールコマ数を選択してください。` +
                `${numberButtons}` +
                `<button id="flex-base-spend-cancel" style="padding:4px 10px;cursor:pointer;">戻る</button>` +
                `<span style="display:block;margin-top:4px;">選択したコマ数 + ${actionName}ボーナス${bonus > 0 ? `(${bonus})` : `(0)`}</span>`;

            messageEl.querySelectorAll(".flex-base-spend-number").forEach(btn => {
                btn.addEventListener("click", () => {
                    const allocated = Number(btn.dataset.value);
                    const actionBonus = getActionBonusValue(actionName);
                    const effectivePower = allocated + actionBonus;

                    if (actionName === "建設") {
                        const required = getMinimumBuildCostForCurrentState();
                        if (required == null || effectivePower < required) {
                            showInsufficientAllocationMessage(actionName, allocated, actionBonus, required);
                            return;
                        }
                    }
                    if (actionName === "十字軍") {
                        const required = getMinimumCrusadeCostForCurrentState();
                        if (required == null || effectivePower < required) {
                            showInsufficientAllocationMessage(actionName, allocated, actionBonus, required);
                            return;
                        }
                    }

                    flexibleBasePoints -= allocated;

                    if (actionName === "影響") {
                        addVictoryPoints(effectivePower);
                        updateStatusUI();
                        showFlexibleCombinedChooser(`影響にコマ${allocated}個を割り当て、ボーナス${actionBonus}を加算。勝利点を${effectivePower}獲得しました。`);
                        return;
                    }

                    if (actionName === "建設") buildUsedThisTurn = true;
                    if (actionName === "十字軍") crusadeUsedThisTurn = true;
                    currentFlexibleAction = actionName;
                    currentFlexibleStartAvailable = effectivePower;
                    resolveActionByName(actionName, effectivePower, true);
                });
            });
            document.getElementById("flex-base-spend-cancel").addEventListener("click", () => showFlexibleCombinedChooser());
        }

        function startFlexibleInfluence() {
            showFlexibleAllocationChooser("影響");
        }

        function startFlexibleSubAction(actionName) {
            showFlexibleAllocationChooser(actionName);
        }

        function resolveSelectedActionSequence(index, tokens) {
            const list = wedgeUpgraded[index] ? upgradedActionLists[index] : [baseActions[index]];
            if (tokens <= 0) {
                setInteractionMode("all");
                messageEl.style.color = "#f87171";
                messageEl.textContent = "ホイールのコマが0個のため、ボーナスだけではアクションを実行できません。";
                return;
            }
            if (wedgeUpgraded[index]) {
                flexibleCombinedMode = true;
                flexibleCombinedActions = [...list];
                flexibleBasePoints = tokens;
                flexibleBonusRemaining = {};
                pendingCombinedActions = [];
                pendingCombinedTokens = 0;
                showFlexibleCombinedChooser(`${actions[index]} を解決します。`);
                return;
            }
            pendingCombinedActions = [];
            pendingCombinedTokens = tokens;
            resolveActionByName(list[0], tokens);
        }

        function continueCombinedAction(finalMessage, color = "#4ade80") {
            if (flexibleCombinedMode && currentFlexibleAction) {
                const remainingAvailable = getCurrentFlexibleRemaining();
                settleFlexibleSpentPoints(remainingAvailable);
                remainingMovePoints = 0;
                availableBuildPoints = 0;
                availableRecruitPoints = 0;
                availableCrusadePoints = 0;
                showFlexibleCombinedChooser(finalMessage);
                return;
            }
            pendingCombinedTokens = 0;
            setInteractionMode("all");
            messageEl.style.color = color;
            messageEl.textContent = finalMessage;
            if (botIsExecutingTurn) setTimeout(() => botCompleteTurn(finalMessage), 0);
            else if (gameMode === "versus") setTimeout(() => completeCurrentTurn(finalMessage), 0);
        }

        function isActionResolutionInProgress() {
            return isSelectingMove
                || isSelectingBuild
                || isSelectingCrusade
                || isSelectingRecruit
                || flexibleCombinedMode
                || currentFlexibleAction !== null;
        }

        function canHandleWheelTapNow() {
            // 騎士団初期設定・マンカラ分配・強化時の分配元選択は許可。
            if (knightOrderSetupMode && knightOrderSetupMode !== "choose-order") return true;
            if (isDistributingTokens) return true;
            if (enhancementAwaitingSource && !enhancementInfoPending) return true;

            // 移動・建設・十字軍・招集など、盤面／ボード上でアクションを
            // 解決している最中の誤タップは完全に無視する。
            if (isActionResolutionInProgress()) return false;

            // 通常の手番開始時はウェッジ選択可能。
            return true;
        }

        function handleWedgeClick(index) {
            if (!canHandleWheelTapNow()) return;
            if (enhancementInfoPending) return;
            if (knightOrderSetupMode && knightOrderSetupMode !== "choose-order") {
                if (handleKnightOrderSetupWedge(index)) return;
            }
            if (gameEnded) {
                messageEl.style.color = "#facc15";
                messageEl.textContent = `ゲームは終了しています。最終勝利点：${playerResources.victoryPoints}点`;
                return;
            }
            if (enhancementAwaitingSource) {
                beginEnhancementDistribution(index);
                return;
            }

            if (isDistributingTokens) {
                const selectable = getDistributionSelectableIndices();
                if (!selectable.includes(index)) {
                    messageEl.style.color = "#f87171";
                    renderDistributionMessage("そのマスには配置できません。");
                    return;
                }

                if (selectedKnightOrder === "ホスピタル騎士団" && !distributionSpecialUsed && index !== distributionNextIndex) {
                    distributionSpecialUsed = true;
                }

                if ((selectedKnightOrder === "テューダー騎士団") && distributionDirection === 0) {
                    const leftIndex = (distributingSourceIndex - 1 + NUM_WEDGES) % NUM_WEDGES;
                    const rightIndex = (distributingSourceIndex + 1) % NUM_WEDGES;
                    if (index === leftIndex) distributionDirection = -1;
                    else if (index === rightIndex) distributionDirection = 1;
                }

                const tokensBeforePlacement = tokensToDistribute;
                const isTemplarRepeat = selectedKnightOrder === "テンプル騎士団"
                    && !distributionSpecialUsed
                    && templarRepeatIndex !== null
                    && index === templarRepeatIndex
                    && index !== distributionNextIndex;
                const savedNextIndex = distributionNextIndex;

                board[index]++;
                tokensToDistribute--;

                if (distributionSourceStartChoicePending && canStartDistributionOnSource()) {
                    distributionSourceStartChoicePending = false;
                }

                if (isTemplarRepeat) {
                    // 直前のマスへもう1個置いた時点で、このターンの能力を使用済みにする。
                    distributionSpecialUsed = true;
                    templarRepeatIndex = null;
                    distributionNextIndex = tokensToDistribute > 0 ? savedNextIndex : null;
                } else {
                    distributionNextIndex = tokensToDistribute > 0
                        ? (index + distributionDirection + NUM_WEDGES) % NUM_WEDGES
                        : null;
                    // 2個以上を持った状態で通常配置した場合、そのマスを「直前のマス」として
                    // 次の配置時だけテンプル能力の候補にする。
                    templarRepeatIndex = selectedKnightOrder === "テンプル騎士団"
                        && !distributionSpecialUsed
                        && tokensBeforePlacement >= 2
                        && tokensToDistribute > 0
                        ? index
                        : null;
                }
                updateWheelUI();
                wedgeElements.forEach(w => w.classList.remove('active'));
                wedgeElements[index].classList.add('active');
                updateDistributionHighlights();

                if (tokensToDistribute > 0) {
                    renderDistributionMessage();
                    return;
                }

                finishTokenDistribution();
                return;
            }

            if (pendingWedgeChoiceIndex !== null) return;
            if (isAnimating || isSelectingMove || isSelectingBuild || isSelectingCrusade || isSelectingRecruit) return;
            if (!playerPosition) {
                messageEl.style.color = "#f87171";
                messageEl.textContent = "先に NEW GAME ボタンを押してスタート位置を選択してください！";
                return;
            }

            showWedgeChoice(index);
        }

        function resolveActionByName(executedAction, tokens, bonusAlreadyIncluded = false) {
            if (executedAction === "移動") {
                setInteractionMode("map");
                remainingMovePoints = Math.max(0, tokens + (bonusAlreadyIncluded ? 0 : getActionBonusValue("移動")));
                isSelectingMove = true;
                selectedMoveKnight = null;
                clearSelectableHexes();
                renderMoveMessage(`移動アクション（移動力: ${remainingMovePoints}）。移動する騎士コマを選択してください。`);
                highlightKnightsForMove();
            } else if (executedAction === "建設") {
                if (!buildUsedThisTurn) buildUsedThisTurn = true;
                setInteractionMode("map");
                availableBuildPoints = Math.max(0, tokens + (bonusAlreadyIncluded ? 0 : getActionBonusValue("建設")));
                isSelectingBuild = true;
                selectedBuildKnight = null;
                clearBuildableHighlights();

                const hasBuildableKnight = Object.values(knightPositions).some(pos => {
                    if (!pos) return false;
                    const key = `${pos.c},${pos.r}`;
                    if (hexBuildings[key] && hexBuildings[key] !== "空白") return false;
                    const hexInfo = hexInfos[key];
                    if (hexInfo && hexInfo.faction !== "なし") return false;
                    return playerBuildings.some(building => {
                        if (building.name === "軍隊") return false;
                        const currentBuiltCount = playerResources.buildingsBuilt[building.name];
                        const lv = building.levels[currentBuiltCount];
                        if (!lv) return false;
                        let finalCost = lv.c;
                        if (hexInfo && hexInfo.bonus) {
                            const bonusText = hexInfo.bonus;
                            if (bonusText.includes(building.name) && bonusText.includes("コスト-1")) {
                                finalCost = Math.max(0, finalCost - 1);
                            } else if (bonusText.includes("城、教会、農場、銀行コスト-1")) {
                                finalCost = Math.max(0, finalCost - 1);
                            }
                        }
                        return availableBuildPoints >= finalCost;
                    });
                });

                if (!hasBuildableKnight) {
                    isSelectingBuild = false;
                    continueCombinedAction("コストが足りません。建設アクションを終了します。", "#f87171");
                } else {
                    messageEl.style.color = "#facc15";
                    messageEl.textContent = `建設アクション（建設力: ${availableBuildPoints}）。建設する騎士コマを選択してください。`;
                    highlightKnightsForBuild();
                }
            } else if (executedAction === "十字軍") {
                if (!crusadeUsedThisTurn) crusadeUsedThisTurn = true;
                setInteractionMode("map");
                availableCrusadePoints = Math.max(0, tokens + (bonusAlreadyIncluded ? 0 : getActionBonusValue("十字軍")));
                clearSelectableHexes();
                const knightEntries = Object.entries(knightPositions).filter(([, pos]) => pos);
                const knightsOnEnemies = knightEntries.filter(([, pos]) => {
                    const info = hexInfos[`${pos.c},${pos.r}`];
                    return info && info.faction !== "なし";
                });
                const canDefeatAny = knightsOnEnemies.some(([, pos]) => {
                    const info = hexInfos[`${pos.c},${pos.r}`];
                    return getEnemyStrength(info.faction) <= availableCrusadePoints;
                });

                if (knightsOnEnemies.length === 0) {
                    isSelectingCrusade = false;
                    continueCombinedAction("騎士コマがあるマスに異教徒コマがいません。十字軍アクションを終了します。", "#f87171");
                } else if (!canDefeatAny) {
                    isSelectingCrusade = false;
                    continueCombinedAction("コストが足りません。十字軍アクションを終了します。", "#f87171");
                } else {
                    isSelectingCrusade = true;
                    knightsOnEnemies.forEach(([, pos]) => {
                        const info = hexInfos[`${pos.c},${pos.r}`];
                        if (getEnemyStrength(info.faction) <= availableCrusadePoints) {
                            const poly = hexGroups[`${pos.c},${pos.r}`]?.querySelector("polygon");
                            if (poly) poly.classList.add("selectable");
                        }
                    });
                    messageEl.style.color = "#facc15";
                    messageEl.textContent = `十字軍アクション（戦力: ${availableCrusadePoints}）。撃破する異教徒と同じマスにいる騎士コマを選択してください。`;
                    highlightKnightsForCrusade();
                }
            } else if (executedAction === "招集") {
                setInteractionMode("board");
                availableRecruitPoints = Math.max(0, tokens + (bonusAlreadyIncluded ? 0 : getActionBonusValue("招集")));
                isSelectingRecruit = true;

                messageEl.textContent = `${executedAction} のアクション（強さ:${tokens}）完了。`;
            }
            if (botIsExecutingTurn) {
                armBotFailsafe();
                setTimeout(() => botResolvePendingAction(executedAction), 0);
            }
        }

        function getNeighbors(col, row) {
            const neighbors = [];
            const evenOffsets = [
                {dc: 0, dr: -1}, {dc: 0, dr: 1},
                {dc: -1, dr: -1}, {dc: -1, dr: 0},
                {dc: 1, dr: -1}, {dc: 1, dr: 0}
            ];
            const oddOffsets = [
                {dc: 0, dr: -1}, {dc: 0, dr: 1},
                {dc: -1, dr: 0}, {dc: -1, dr: 1},
                {dc: 1, dr: 0}, {dc: 1, dr: 1}
            ];
            const offsets = (col % 2 === 0) ? evenOffsets : oddOffsets;

            offsets.forEach(off => {
                const nc = col + off.dc;
                const nr = row + off.dr;
                const key = `${nc},${nr}`;
                if (hexGroups[key]) {
                    neighbors.push({c: nc, r: nr});
                }
            });
            return neighbors;
        }

            const neighbors = getNeighbors(currentPos.c, currentPos.r);

                if (remainingMovePoints >= cost) {
                    const poly = hexGroups[key].querySelector("polygon");
                    if (poly) poly.classList.add("selectable");
                }
            });
        }

        function addVictoryPoints(amount, options = {}) {
            const points = Math.max(0, Number(amount) || 0);
            if (points <= 0) return 0;

            playerResources.victoryPoints += points;

            if (!options.endGameBonus && !gameEnded) {
                remainingVictoryPoints = Math.max(0, remainingVictoryPoints - points);
                if (remainingVictoryPoints === 0 && !gameEndScheduled) {
                    gameEndScheduled = true;
                    setTimeout(finishGameFromVictoryPool, 0);

        function calculateEndGameBonuses() {
            let total = 0;
            const details = [];

            if (playerResources.endGameBonuses.castleEnemySet) {
                const sets = Math.min(
                    playerResources.defeated["サラセン人"],
                    playerResources.defeated["プロイセン人"],
                    playerResources.defeated["スラブ人"]
                );
                const points = sets * 4;
                total += points;
                details.push(`城Lv4：異教徒3種 ${sets}セット ×4 = ${points}点`);
            }

            if (playerResources.endGameBonuses.farmKnightArmy) {
                const knightsOnMap = Object.values(knightPositions).filter(Boolean).length;
                const activeArmyTiles = playerResources.buildingsBuilt["軍隊"];
                const points = knightsOnMap + activeArmyTiles;
                total += points;
                details.push(`農場Lv4：騎士${knightsOnMap}＋軍隊${activeArmyTiles} = ${points}点`);
            }

            if (playerResources.endGameBonuses.bankLevel4Buildings) {
                const level4Buildings = ["城", "教会", "農場", "銀行"]
                    .filter(name => playerResources.buildingsBuilt[name] >= 4).length;
                const points = level4Buildings * 4;
                total += points;
                details.push(`銀行Lv4：Lv4建物 ${level4Buildings}個 ×4 = ${points}点`);
            }

            return { total, details };
        }

        function calculateVersusEnemyMajorityBonuses() {
            const enemyTypes = ["サラセン人", "プロイセン人", "スラブ人"];
            const perPlayer = [0, 0];
            const details = [[], []];

            enemyTypes.forEach(enemyType => {
                const a = playerStates[0]?.resources?.defeated?.[enemyType] || 0;
                const b = playerStates[1]?.resources?.defeated?.[enemyType] || 0;

                let bonusA = 0;
                let bonusB = 0;

                if (a === 0 && b === 0) {
                    bonusA = 0;
                    bonusB = 0;
                } else if (a === b) {
                    bonusA = a > 0 ? 3 : 0;
                    bonusB = b > 0 ? 3 : 0;
                } else if (a > b) {
                    bonusA = a > 0 ? 5 : 0;
                    bonusB = b > 0 ? 2 : 0;
                } else {
                    bonusB = b > 0 ? 5 : 0;
                    bonusA = a > 0 ? 2 : 0;
                }

                perPlayer[0] += bonusA;
                perPlayer[1] += bonusB;
                details[0].push(`${enemyType}：${a}体 → +${bonusA}点`);
                details[1].push(`${enemyType}：${b}体 → +${bonusB}点`);
            });

            return { perPlayer, details };
        }

        function finishGameFromVictoryPool() {
            if (gameEnded || remainingVictoryPoints > 0) {
                gameEndScheduled = false;
                return;
            }

            if (gameMode === "versus") {
                snapshotCurrentPlayerState();
                gameEnded = true;
                gameEndScheduled = false;
                const majority = calculateVersusEnemyMajorityBonuses();
                playerStates.forEach((st, playerIndex) => {
                    const r=st.resources;
                    let buildingBonus=0;
                    if (r.endGameBonuses.castleEnemySet) buildingBonus += Math.min(r.defeated["サラセン人"],r.defeated["プロイセン人"],r.defeated["スラブ人"])*4;
                    if (r.endGameBonuses.farmKnightArmy) buildingBonus += Object.values(st.knightPositions||{}).filter(Boolean).length + (r.buildingsBuilt["軍隊"]||0);
                    if (r.endGameBonuses.bankLevel4Buildings) buildingBonus += ["城","教会","農場","銀行"].filter(n=>(r.buildingsBuilt[n]||0)>=4).length*4;

                    const enemyMajorityBonus = majority.perPlayer[playerIndex] || 0;
                    const totalEndBonus = buildingBonus + enemyMajorityBonus;

                    r.victoryPoints += totalEndBonus;
                    st.endGameBonus = totalEndBonus;
                    st.buildingEndGameBonus = buildingBonus;
                    st.enemyMajorityBonus = enemyMajorityBonus;
                    st.enemyMajorityDetails = majority.details[playerIndex];
                });
                const a=playerStates[0], b=playerStates[1];
                const winner=a.resources.victoryPoints===b.resources.victoryPoints ? "引き分け" : (a.resources.victoryPoints>b.resources.victoryPoints?a.name:b.name)+"の勝利";
                loadPlayerState(currentPlayerIndex);
                messageEl.style.color="#facc15";
                messageEl.textContent="ゲーム終了。結果を表示しています。";
                setInteractionMode("none");
                showGameResult(
                    winner,
                    `<div class="result-score">${a.name}：${a.resources.victoryPoints}点</div>` +
                    `<div class="result-detail">建物終了時 +${a.buildingEndGameBonus||0} ／ 異教徒撃破 +${a.enemyMajorityBonus||0}<br>${a.enemyMajorityDetails?.join(" / ") || ""}</div>` +
                    `<div class="result-score">${b.name}：${b.resources.victoryPoints}点</div>` +
                    `<div class="result-detail">建物終了時 +${b.buildingEndGameBonus||0} ／ 異教徒撃破 +${b.enemyMajorityBonus||0}<br>${b.enemyMajorityDetails?.join(" / ") || ""}</div>`
                );
                return;
            }

            gameEnded = true;
            gameEndScheduled = false;

            isDistributingTokens = false;
            enhancementAwaitingSource = false;
            enhancementInfoPending = false;
            isSelectingMove = false;
            isSelectingBuild = false;
            isSelectingRecruit = false;

            clearSelectableHexes();
            clearBuildableHighlights();
            clearRecruitableHighlights();
            wedgeElements.forEach(w => w.classList.remove("active"));

            const endBonus = calculateEndGameBonuses();
            if (endBonus.total > 0) {
                addVictoryPoints(endBonus.total, { endGameBonus: true });
            } else {
                updateStatusUI();
            }

            setInteractionMode("all");
            messageEl.style.color = "#facc15";
            const details = endBonus.details.length
                ? `<br>${endBonus.details.join("<br>")}<br>終了時ボーナス合計：${endBonus.total}点`
                : "<br>終了時ボーナス：0点";
            messageEl.textContent = "ゲーム終了。結果を表示しています。";
            showGameResult(
                "ゲーム終了",
                `<div class="result-score">最終勝利点：${playerResources.victoryPoints}点</div>` +
                `<div class="result-detail">${endBonus.details.length ? endBonus.details.join("<br>") : "終了時ボーナス：0点"}<br>終了時ボーナス合計：${endBonus.total}点</div>`
            );
        }

        function executeSaracenDefeatBonus(hexKey, hexInfo) {
            const bonus = hexInfo?.saracenBonus || (hexInfo?.memo || "").replace("【撃破ボーナス】\n", "").trim();
            if (!bonus) return "";

            if (bonus === "軍隊+1") {
                const army = playerBuildings.find(b => b.name === "軍隊");
                const index = playerResources.buildingsBuilt["軍隊"];
                const lv = army?.levels?.[index];
                const tile = buildingTileElements["軍隊"]?.[index];
                if (!lv) return " 撃破ボーナス「軍隊+1」は、すべての軍隊タイルが有効なため適用できませんでした。";
                playerResources.buildingsBuilt["軍隊"]++;
                playerResources.bonuses.military++;
                addVictoryPoints(lv.p);
                if (tile) {
                    tile.style.opacity = "0.3";
                    tile.style.pointerEvents = "none";
                }
                return ` 撃破ボーナス「軍隊+1」：軍隊タイルをコスト無視で有効化。軍事力+1、勝利点+${lv.p}。`;
            }

            const buildingName = bonus.replace("+1", "");
            if (!["城", "教会", "農場", "銀行"].includes(buildingName)) return "";
            if (hexBuildings[hexKey] && hexBuildings[hexKey] !== "空白") {
                return ` 撃破ボーナス「${bonus}」は、このマスに既に建物があるため適用できませんでした。`;
            }
            const building = playerBuildings.find(b => b.name === buildingName);
            const index = playerResources.buildingsBuilt[buildingName];
            const lv = building?.levels?.[index];
            const tile = buildingTileElements[buildingName]?.[index];
            if (!lv) return ` 撃破ボーナス「${bonus}」は、${buildingName}がすべて建設済みのため適用できませんでした。`;

            playerResources.buildingsBuilt[buildingName]++;
            const mapVictoryBonus = getBuildVictoryPointBonus(hexInfo, buildingName);
            addVictoryPoints(lv.p + mapVictoryBonus);
            const builtLevel = playerResources.buildingsBuilt[buildingName];
            const pos = hexKey.split(',').map(Number);
            const effectMessage = applyBuildingLevelEffects(buildingName, builtLevel, pos[0], pos[1]);
            if (tile) {
                tile.style.opacity = "0.3";
                tile.style.pointerEvents = "none";
            }
            hexBuildings[hexKey] = buildingName;
            hexInfo.building = buildingName;
            hexInfo.affiliation = getCurrentAffiliation();
            updateHexAffiliationVisual(hexKey);

            const group = hexGroups[hexKey];
            if (group) {
                const cx = pos[0] * X_OFFSET;
                let cy = pos[1] * Y_OFFSET;
                if (pos[0] % 2 !== 0) cy += Y_OFFSET / 2;
                const bText = document.createElementNS(SVG_NS, "text");
                bText.setAttribute("x", cx);
                bText.setAttribute("y", cy - 12);
                bText.setAttribute("font-size", "10px");
                bText.setAttribute("font-weight", "bold");
                bText.setAttribute("fill", hexInfo.affiliation === "ボット" ? "#ffffff" : "#000000");
                bText.setAttribute("text-anchor", "middle");

            return ` 撃破ボーナス「${bonus}」：${buildingName}をコスト無視で建設。勝利点+${lv.p + mapVictoryBonus}${mapVictoryBonus ? `（ボーナスタイル+${mapVictoryBonus}）` : ""}${effectMessage ? `、${effectMessage}` : ""}。`;
