<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crusaders Solo / Human vs BOT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: row;
            height: 100vh;
            overflow: hidden;
            background-color: #111827;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            gap: 8px;
            padding: 8px;
        }

        /* 左側：マップ＋メッセージ領域 (2/3) */
        #left-section {
            flex: 1.35;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0;
            gap: 6px;
        }

        #map-section {
            flex: 1;
            min-height: 0;
            position: relative;
            z-index: 100;
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            border: 1px solid #64748b;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.38);
            overflow: hidden;
            transition: opacity 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }

        #map-section.window-front {
            z-index: 400;
            box-shadow: 0 12px 34px rgba(0,0,0,0.62), 0 0 0 2px rgba(250,204,21,0.35);
        }

        #map-svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .hex {
            fill: #334155;
            stroke: #94a3b8;
            stroke-width: 1;
            cursor: pointer;
            transition: fill 0.2s;
        }

        .hex:hover {
            filter: brightness(1.08);
        }

        .hex.selectable {
            stroke: #facc15;
            stroke-width: 3;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.8; }
            50% { opacity: 1; }
            100% { opacity: 0.8; }
        }

        /* マップ外HUD：操作ボタン／ゲームスコア */
        #map-hud-area {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }

        .map-hud-window {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 7px;
            min-width: 0;
            padding: 6px 8px;
            border: 1px solid #64748b;
            border-radius: 9px;
            background: rgba(15, 23, 42, 0.97);
            box-shadow: 0 4px 10px rgba(0,0,0,0.35);
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
        }

        #map-toolbar-window button {
            flex: 0 0 auto;
            min-width: 92px;
            padding: 7px 11px;
            border: 1px solid #64748b;
            border-radius: 7px;
            background: rgba(30, 41, 59, 0.98);
            color: #f8fafc;
            font-weight: 800;
            font-size: 0.78rem;
            cursor: pointer;
        }

        #new-game-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8) !important;
            border-color: #3b82f6 !important;
        }

        #map-toolbar-window button:hover {
            filter: brightness(1.12);
        }

        #map-score-window {
            justify-content: space-between;
            gap: 12px;
            font-size: 0.76rem;
        }

        #map-score-window > span {
            flex: 0 0 auto;
            display: inline-block;
        }

        #map-score-window .map-status-vp {
            color: #fde047;
            font-weight: 800;
        }

        #map-score-window .map-status-enemy {
            color: #e2e8f0;
            font-weight: 700;
        }
        #game-result-modal {
            position:fixed;
            inset:0;
            z-index:30000;
            display:none;
            align-items:center;
            justify-content:center;
            padding:16px;
            background:rgba(2,6,23,.58);
        }
        #game-result-modal.active {display:flex;}
        #game-result-window {
            width:min(560px,calc(100vw - 28px));
            max-height:min(86vh,680px);
            overflow:hidden;
            border:2px solid #facc15;
            border-radius:14px;
            background:#0f172a;
            color:#f8fafc;
            box-shadow:0 20px 60px rgba(0,0,0,.7);
            display:flex;
            flex-direction:column;
        }
        #game-result-title {
            padding:12px 14px;
            font-size:1.2rem;
            font-weight:900;
            text-align:center;
            background:#1e293b;
            border-bottom:1px solid #475569;
            color:#fde047;
        }
        #game-result-body {
            padding:14px 16px;
            overflow-y:auto;
            line-height:1.55;
            text-align:center;
        }
        #game-result-body .result-score {
            font-size:1.05rem;
            font-weight:800;
            margin:8px 0;
        }
        #game-result-body .result-detail {
            margin:6px 0 10px;
            color:#cbd5e1;
            font-size:.88rem;
        }
        #game-result-actions {
            padding:12px 14px 14px;
            display:flex;
            justify-content:center;
            border-top:1px solid #334155;
            background:#111827;
        }
        #game-result-back-btn {
            min-width:150px;
            padding:9px 16px;
            border:2px solid #facc15;
            border-radius:8px;
            background:#1e293b;
            color:#fef08a;
            font-weight:800;
            cursor:pointer;
        }
        #game-result-back-btn:hover {background:#334155;}
        .info-modal {position:fixed;inset:0;z-index:20000;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(2,6,23,.42);}
        .info-modal.active {display:flex;}
        .info-window {width:min(720px,calc(100vw - 28px));max-height:min(82vh,720px);display:flex;flex-direction:column;overflow:hidden;border:2px solid #94a3b8;border-radius:12px;background:#0f172a;color:#f8fafc;box-shadow:0 16px 44px rgba(0,0,0,.65);}
        .info-window-header {flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid #475569;background:#1e293b;font-weight:800;}
        .info-window-close {min-width:72px;padding:6px 10px;border:1px solid #64748b;border-radius:6px;background:#334155;color:#fff;cursor:pointer;}
        .info-window-body {overflow-y:auto;padding:12px 14px 16px;line-height:1.55;font-size:.88rem;}
        #game-log-lines {display:flex;flex-direction:column;gap:5px;}
        .game-log-row {padding:5px 8px;border-bottom:1px solid rgba(100,116,139,.35);overflow-wrap:anywhere;}
        .game-log-number {color:#94a3b8;margin-right:7px;}
        .manual-section {margin-bottom:14px;}
        .manual-section h3 {margin:0 0 5px;color:#fde047;font-size:.98rem;}
        .manual-section p {margin:0 0 5px;}
        .manual-section ul {padding-left:1.25rem;margin:4px 0;}
        .manual-order {margin:5px 0;padding:6px 8px;border-left:3px solid #64748b;background:rgba(30,41,59,.6);}


        /* 右側：UI領域 (1/3) */
        #ui-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: transparent;
            height: 100%;
            min-width: 0;
            overflow: hidden;
        }

        /* 右側：プレイヤーボードとアクションホイールを連続表示 */
        #board-container {
            flex: 1 1 auto;
            min-height: 0;
            position: relative;
            z-index: 100;
            padding: 15px 15px 10px 15px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 12px;
            justify-content: flex-start;
            background: #1e293b;
            border: 1px solid #64748b;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.38);
            transition: opacity 0.15s ease, filter 0.15s ease, box-shadow 0.15s ease;
        }

        #board-container.window-front {
            z-index: 400;
            box-shadow: 0 12px 34px rgba(0,0,0,0.62), 0 0 0 2px rgba(250,204,21,0.35);
        }

        /* プレイヤーステータス */
        #status-panel {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px 10px;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 0.78rem;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .status-label {
            color: #cbd5e1;
        }

        .status-value {
            color: #f8fafc;
            font-weight: bold;
        }

        #defeat-status {
            grid-column: 1 / -1;
        }

        .status-action-row {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            white-space: nowrap;
            color: #cbd5e1;
        }

        .status-action-row strong {
            color: #f8fafc;
            font-weight: 800;
            margin-left: 2px;
        }

        /* ドラッグ可能なフローティング・アクションホイール */
        #wheel-container {
            position: fixed;
            left: calc(100vw - 242px);
            right: auto;
            top: 52%;
            transform: translateY(-50%);
            z-index: 200;
            width: 232px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 0 5px 8px 5px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid #64748b;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.45);
            touch-action: none;
        }

        #wheel-drag-handle {
            width: calc(100% + 10px);
            margin: 0 -5px 4px -5px;
            padding: 6px 5px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: bold;
            color: #cbd5e1;
            background: #334155;
            border-radius: 10px 10px 0 0;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        #wheel-drag-handle:active { cursor: grabbing; }

        #wheel-container.window-front {
            z-index: 500;
        }

        .interaction-locked {
            opacity: 0.25 !important;
            pointer-events: none !important;
            filter: grayscale(0.35);
        }

        #wheel-svg-wrapper {
            width: 100%;
            flex: 0 0 auto;
            min-height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #wheel-svg {
            width: 220px;
            height: 220px;
            max-width: 220px;
            overflow: visible;
        }

        .wedge {
            fill: #334155;
            stroke: #0f172a;
            stroke-width: 2;
            cursor: pointer;
            transition: fill 0.2s ease;
        }

        .wedge:hover {
            fill: #475569;
        }

        .wedge.active {
            fill: #3b82f6;
        }

        .wedge.distribution-selectable {
            stroke: #facc15;
            stroke-width: 6;
            filter: drop-shadow(0 0 6px rgba(250, 204, 21, 0.95));
            cursor: pointer;
        }

        .wedge.distribution-disabled {
            opacity: 0.42;
            cursor: not-allowed;
        }

        .wedge-text {
            fill: #94a3b8;
            font-size: 13px;
            text-anchor: middle;
            pointer-events: none;
        }

        .token-count {
            fill: #f8fafc;
            font-size: 22px;
            font-weight: bold;
            pointer-events: none;
            text-anchor: middle;
            dominant-baseline: middle;
        }

        .mancala-cube-layer {
            pointer-events: none;
        }

        .mancala-cube {
            pointer-events: none;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.45));
        }

        .mancala-cube .cube-top { fill: #86efac; }
        .mancala-cube .cube-left { fill: #22c55e; }
        .mancala-cube .cube-right { fill: #15803d; }

        .mancala-cube.floating .cube-body {
            animation: mancalaCubeHover 0.8s ease-in-out infinite alternate;
            filter: drop-shadow(0 7px 4px rgba(0,0,0,0.55));
        }

        @keyframes mancalaCubeHover {
            from { transform: translateY(-5px); }
            to { transform: translateY(-11px); }
        }

        #message {
            flex: 0 0 auto;
            position: relative;
            z-index: 120;
            width: 100%;
            box-sizing: border-box;
            min-height: 42px;
            margin: 0;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #cbd5e1;
            text-align: center;
            background-color: #1e293b;
            border-top: 2px solid #334155;
            border-right: none;
            border-bottom: none;
            border-left: none;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: center;
            gap: 4px;
            z-index: 30;
        }

        #message button {
            width: 100%;
            display: block;
            box-sizing: border-box;
            margin: 0 !important;
            padding: 6px 10px !important;
            cursor: pointer;
            writing-mode: horizontal-tb;
            white-space: nowrap;
            text-align: center;
        }

        #message input,
        #message select {
            width: 100%;
            box-sizing: border-box;
            margin: 0;
        }

        .knight-order-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
        }

        .knight-order-title {
            width: 100%;
            text-align: center;
            margin-bottom: 2px;
            writing-mode: horizontal-tb;
        }

        .knight-action-highlight circle:not(:first-child) {
            stroke: #facc15 !important;
            stroke-width: 5 !important;
            filter: drop-shadow(0 0 5px #facc15) drop-shadow(0 0 10px #f59e0b);
        }

        .knight-action-highlight {
            animation: knightActionPulse 0.9s ease-in-out infinite alternate;
        }

        @keyframes knightActionPulse {
            from { opacity: 0.82; }
            to { opacity: 1; }
        }

        .knight-order-choice {
            width: 100%;
            display: block;
            box-sizing: border-box;
            margin: 0;
            padding: 8px 10px;
            cursor: pointer;
            writing-mode: horizontal-tb;
            white-space: nowrap;
            text-align: left;
        }

        .knight-order-item {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .knight-order-ability {
            width: 100%;
            box-sizing: border-box;
            padding: 0 8px 5px 8px;
            color: #cbd5e1;
            font-size: 0.72rem;
            line-height: 1.35;
            text-align: left;
            writing-mode: horizontal-tb;
            white-space: normal;
        }

        /* 選択肢専用モーダル */
        #choice-modal {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 12000;
            display: none;
            width: fit-content;
            min-width: 210px;
            max-width: min(360px, calc(100vw - 24px));
            max-height: min(78vh, 620px);
            overflow-y: auto;
            box-sizing: border-box;
            padding: 12px;
            border: 2px solid #94a3b8;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.98);
            box-shadow: 0 12px 32px rgba(0,0,0,0.6);
        }

        #choice-modal.avoid-map {
            left: auto;
            right: 12px;
            transform: translateY(-50%);
        }

        #choice-modal.avoid-board {
            left: 12px;
            right: auto;
            transform: translateY(-50%);
        }

        #choice-modal.active {
            display: block;
        }

        #choice-modal-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        #choice-modal button {
            width: auto;
            min-width: 160px;
            max-width: 300px;
            display: block;
            box-sizing: border-box;
            margin: 0 !important;
            padding: 8px 14px !important;
            cursor: pointer;
            writing-mode: horizontal-tb;
            white-space: nowrap;
            text-align: center;
        }

        #choice-modal .knight-order-list {
            width: 100%;
        }

        @media (orientation: landscape) and (max-height: 520px) {
            #choice-modal {
                max-height: 86vh;
                width: fit-content;
                min-width: 190px;
                max-width: min(330px, calc(100vw - 18px));
                padding: 8px;
            }
            #choice-modal.avoid-map {
                right: 6px;
            }
            #choice-modal.avoid-board {
                left: 6px;
            }
            #choice-modal button {
                min-width: 145px;
                max-width: 280px;
                padding: 6px 10px !important;
                font-size: 0.72rem;
            }
            #choice-modal .knight-order-ability {
                font-size: 0.66rem;
            }
        }

        .building-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .building-title {
            width: 45px;
            font-weight: bold;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .building-tiles {
            display: flex;
            gap: 4px;
        }

        .tile {
            background-color: #475569;
            border: 1px solid #64748b;
            border-radius: 4px;
            padding: 3px 6px;
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 40px;
        }

        .tile .cost { color: #fca5a5; }
        .tile .vp { color: #fde047; }

        .tile.build-selectable {
            border: 2px solid #facc15;
            box-shadow: 0 0 8px rgba(250, 204, 21, 0.8);
        }

        .building-tile-wrapper {
            position: relative;
        }

        #building-tooltip {
            position: fixed;
            display: none;
            z-index: 1000;
            max-width: min(280px, calc(100vw - 20px));
            padding: 8px 10px;
            border: 1px solid #64748b;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.96);
            color: #f8fafc;
            font-size: 0.8rem;
            line-height: 1.45;
            white-space: pre-line;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.35);
        }

        .tile.recruit-selectable {
            border: 2px solid #facc15;
            box-shadow: 0 0 8px rgba(250, 204, 21, 0.8);
        }

        /* マップ情報：マップウインドウを越えて画面全体へ表示 */
        #tooltip {
            position: fixed;
            background: rgba(0, 0, 0, 0.94);
            color: white;
            padding: 10px;
            border-radius: 7px;
            font-size: 0.85rem;
            pointer-events: none;
            display: none;
            z-index: 50000;
            white-space: pre-line;
            border: 1px solid #64748b;
            box-shadow: 0 8px 20px rgba(0,0,0,0.62);
            max-width: min(320px, calc(100vw - 16px));
            max-height: calc(100vh - 16px);
            overflow: hidden;
            overflow-wrap: anywhere;
            box-sizing: border-box;
        }

        @media (orientation: landscape) and (max-width: 1180px) {
            #map-hud-area {
                gap: 3px;
            }

            .map-hud-window {
                gap: 4px;
                padding: 4px 5px;
                border-radius: 7px;
            }

            #map-toolbar-window button {
                min-width: 0;
                padding: 5px 8px;
                font-size: 0.68rem;
            }

            #map-score-window {
                justify-content: flex-start;
                gap: 8px;
                font-size: 0.64rem;
            }

            #tooltip {
                font-size: 0.72rem;
                padding: 7px;
                max-width: min(280px, calc(100vw - 12px));
                max-height: calc(100vh - 12px);
            }
        }

        /* スマートフォン・タブレット横画面対応 */
        @media (orientation: landscape) and (max-width: 1180px) {
            body {
                height: 100dvh;
                min-height: 100dvh;
                padding: 6px;
                gap: 6px;
            }

            #map-section {
                flex: 1.25;
                min-width: 0;
                padding-left: 0;
            }

            #ui-section {
                flex: 1;
                min-width: min(330px, 42vw);
                height: 100%;
                overflow: hidden;
            }

            #board-container {
                padding: 8px 10px 6px 10px;
                gap: 7px;
            }

            #status-panel {
                gap: 4px 8px;
                padding: 7px;
                font-size: 0.70rem;
            }

            .building-row {
                gap: 5px;
            }

            .building-title {
                width: 38px;
                font-size: 0.72rem;
            }

            .building-tiles {
                gap: 3px;
            }

            .tile {
                min-width: 34px;
                padding: 2px 4px;
                font-size: 0.67rem;
            }

            #wheel-container {
                width: min(238px, 40vw, 42vh);
                min-width: 0;
                left: calc(100vw - min(238px, 40vw, 42vh) - 8px);
                right: auto;
                top: 50%;
                padding: 0 3px 5px 3px;
            }

            #wheel-svg {
                width: min(228px, 38vw, 38vh);
                height: min(228px, 38vw, 38vh);
                max-width: 228px;
            }

            #wheel-svg-wrapper {
                width: 100%;
            }

            #wheel-drag-handle {
                width: calc(100% + 6px);
                margin-left: -3px;
                margin-right: -3px;
                padding-left: 3px;
                padding-right: 3px;
            }

            .wedge-text {
                font-size: 11px;
            }

            .token-count {
                font-size: 18px;
            }

            #message {
                font-size: 0.75rem;
                min-height: 32px;
                padding: 4px 8px;
            }

        }

        @media (orientation: landscape) and (max-height: 520px) {
            #map-hud-area {
                gap: 2px;
            }

            .map-hud-window {
                padding: 3px 4px;
                gap: 3px;
            }

            #map-toolbar-window button {
                padding: 4px 6px;
                font-size: 0.62rem;
            }

            #map-score-window {
                gap: 6px;
                font-size: 0.58rem;
            }

            body {
                padding: 4px;
                gap: 4px;
            }

            #ui-section {
                min-width: min(300px, 43vw);
            }

            #board-container {
                padding: 5px 8px 4px 8px;
                gap: 4px;
            }

            #status-panel {
                padding: 5px;

        /* BOT controller */

            width: auto !important;
            min-width: 150px;
            max-width: min(260px, 78vw);
        }

    </style>
</head>
<body>

    <!-- 画面左側：マップ＋メッセージ -->
    <div id="left-section">
        <div id="map-hud-area">
            <div id="map-toolbar-window" class="map-hud-window">
                <button id="new-game-btn">NEW GAME</button>
                <button id="game-log-btn">GAME LOG</button>
                <button id="manual-btn">MANUAL</button>
            </div>
            <div id="map-score-window" class="map-hud-window">
                <span class="map-status-vp">残り勝利点 <span id="map-vp">140</span></span>
                <span class="map-status-enemy">サラセン人 <span id="map-strength-saracen">6</span></span>
                <span class="map-status-enemy">プロイセン人 <span id="map-strength-prussian">3</span></span>
                <span class="map-status-enemy">スラブ人 <span id="map-strength-slav">3</span></span>
            </div>
        </div>
        <div id="map-section">
            <svg id="map-svg" viewBox="36 18 410 370" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div id="message">NEW GAMEボタンを押してゲームを開始してください</div>
    </div>

    <div id="tooltip"></div>

    <div id="game-result-modal" role="dialog" aria-modal="true" aria-live="polite">
        <div id="game-result-window">
            <div id="game-result-title">GAME RESULT</div>
            <div id="game-result-body"></div>
            <div id="game-result-actions">
                <button id="game-result-back-btn">戻る</button>
            </div>
        </div>
    </div>

    <div id="choice-modal" role="dialog" aria-modal="true" aria-live="polite">
        <div id="choice-modal-content"></div>
    </div>

    <div id="game-log-modal" class="info-modal" role="dialog" aria-modal="true">
        <div class="info-window">
            <div class="info-window-header"><span>GAME LOG</span><button id="game-log-close" class="info-window-close">閉じる</button></div>
            <div class="info-window-body"><div id="game-log-lines"></div></div>
        </div>
    </div>

    <div id="manual-modal" class="info-modal" role="dialog" aria-modal="true">
        <div class="info-window">
            <div class="info-window-header"><span>MANUAL</span><button id="manual-close" class="info-window-close">閉じる</button></div>
            <div id="manual-content" class="info-window-body"></div>
        </div>
    </div>

    <!-- 画面右側：UI -->
    <div id="ui-section">
        <!-- 上部：ボード -->
        <div id="board-container"></div>

        <!-- 下部：ホイール -->
        <div id="wheel-container">
            <div id="wheel-drag-handle">ACTION WHEEL</div>
            <div id="wheel-svg-wrapper">
                <svg id="wheel-svg" viewBox="-110 -110 220 220"></svg>
            </div>
        </div>
    </div>

    <script>
        const SVG_NS = "http://www.w3.org/2000/svg";

        // ==========================================
        // 1. マップ生成ロジック
        // ==========================================
        const mapSvg = document.getElementById("map-svg");
        const tooltip = document.getElementById("tooltip");
        const messageEl = document.getElementById("message");
        const gameLogBtn = document.getElementById("game-log-btn");
        const gameLogModal = document.getElementById("game-log-modal");
        const gameLogClose = document.getElementById("game-log-close");
        const gameLogLines = document.getElementById("game-log-lines");
        const manualBtn = document.getElementById("manual-btn");
        const manualModal = document.getElementById("manual-modal");
        const manualClose = document.getElementById("manual-close");
        const manualContent = document.getElementById("manual-content");
        const gameResultModal = document.getElementById("game-result-modal");
        const gameResultTitle = document.getElementById("game-result-title");
        const gameResultBody = document.getElementById("game-result-body");
        const gameResultBackBtn = document.getElementById("game-result-back-btn");

        const choiceModal = document.getElementById("choice-modal");
        const choiceModalContent = document.getElementById("choice-modal-content");
        let movingChoicesToModal = false;
        let choiceModalMessageState = "";

        function getChoiceMessageState() {
            return (messageEl?.textContent || "").replace(/\s+/g, " ").trim();
        }

        function hideChoiceModal() {
            if (!choiceModal || !choiceModalContent) return;
            choiceModal.classList.remove("active");
            choiceModalContent.innerHTML = "";
            choiceModalMessageState = "";
        }

        function moveMessageChoicesToModal() {
            if (!messageEl || !choiceModal || !choiceModalContent || movingChoicesToModal) return;

            const knightOrderList = messageEl.querySelector(".knight-order-list");
            const buttons = Array.from(messageEl.querySelectorAll("button"));
            if (!knightOrderList && buttons.length === 0) {
                // 選択肢をモーダルへ移した直後のDOM変化では保持する。
                // その後メッセージ本文が変わった場合は、古い選択肢なので必ず閉じる。
                if (choiceModalContent.children.length && getChoiceMessageState() !== choiceModalMessageState) {
                    hideChoiceModal();
                } else if (!choiceModalContent.children.length) {
                    choiceModal.classList.remove("active");
                }
                return;
            }

            movingChoicesToModal = true;
            choiceModalContent.innerHTML = "";

            if (knightOrderList) {
                choiceModalContent.appendChild(knightOrderList);
            } else {
                buttons.forEach(button => choiceModalContent.appendChild(button));
            }

            choiceModalMessageState = getChoiceMessageState();
            choiceModal.classList.add("active");
            movingChoicesToModal = false;
        }

        const messageChoiceObserver = new MutationObserver(() => {
            if (movingChoicesToModal) return;
            queueMicrotask(moveMessageChoicesToModal);
        });
        messageChoiceObserver.observe(messageEl, { childList: true, subtree: true, characterData: true });

        const newGameBtn = document.getElementById("new-game-btn");

        let gameLogEntries = [];
        let gameLogSequence = 0;
        let lastObservedMessage = "";

        function getLogActorLabel() {
            if (gameMode === "versus" && playerStates?.[currentPlayerIndex]) return playerStates[currentPlayerIndex].name || (playerController === "bot-normal" ? "BOT" : "人間");
            return playerController === "bot-normal" ? "BOT" : "プレイヤー";
        }
        function normalizeLogText(text) { return String(text || "").replace(/\s+/g," ").trim(); }
        function appendGameLog(text, actor = null) {
            const clean = normalizeLogText(text); if (!clean) return;
            gameLogSequence++;
            gameLogEntries.push({n:gameLogSequence,actor:actor || getLogActorLabel(),text:clean});
            if (gameLogEntries.length > 500) gameLogEntries.shift();
            renderGameLog();
        }
        function renderGameLog() {
            if (!gameLogLines) return; gameLogLines.innerHTML = "";
            if (!gameLogEntries.length) { gameLogLines.textContent = "まだログはありません。"; return; }
            gameLogEntries.forEach(entry => {
                const row=document.createElement("div"); row.className="game-log-row";
                const num=document.createElement("span"); num.className="game-log-number"; num.textContent=`#${entry.n}`;
                const txt=document.createElement("span"); txt.textContent=`${entry.actor}：${entry.text}`;
                row.appendChild(num); row.appendChild(txt); gameLogLines.appendChild(row);
            });
            gameLogLines.parentElement.scrollTop=gameLogLines.parentElement.scrollHeight;
        }
        function resetGameLog() { gameLogEntries=[]; gameLogSequence=0; lastObservedMessage=""; appendGameLog("NEW GAME"); }

        const gameMessageObserver = new MutationObserver(() => {
            const text=normalizeLogText(messageEl.textContent);
            if (!text || text===lastObservedMessage) return;
            lastObservedMessage=text;
            const skip=[/^強調された/,/^移動する騎士コマを選択/,/^騎士\d+を選択しました。移動先/,/^建設する騎士コマを選択/,/^十字軍を行う騎士コマを選択/,/^使用するコマ数を選択/];
            if (skip.some(rx=>rx.test(text))) return;
            appendGameLog(text);
        });
        gameMessageObserver.observe(messageEl,{childList:true,subtree:true,characterData:true});

        function openInfoModal(modal){modal?.classList.add("active");}
        function closeInfoModal(modal){modal?.classList.remove("active");}
        gameLogBtn?.addEventListener("click",()=>{renderGameLog();openInfoModal(gameLogModal);});
        gameLogClose?.addEventListener("click",()=>closeInfoModal(gameLogModal));
        gameLogModal?.addEventListener("click",e=>{if(e.target===gameLogModal)closeInfoModal(gameLogModal);});

        function buildManualHtml(){
            const orderRows = typeof knightOrders!=="undefined" && typeof knightOrderAbilities!=="undefined" ? knightOrders.map(name=>`<div class="manual-order"><strong>${name}</strong><br>${knightOrderAbilities[name]||""}</div>`).join("") : "";
            return `
                <div class="manual-section"><h3>ゲームの目的</h3><p>勝利点プール140点をプレイヤーが獲得するたびに減らします。0になった時点でゲーム終了です。超過分もプレイヤー得点に加算し、最後にLv4建物の終了時ボーナスを加えます。</p></div>
                <div class="manual-section"><h3>アクションホイール</h3><p>使用ウェッジのコマをマンカラ式に分配してからアクションを解決します。強化ウェッジでは2種類のアクションへコマを分割できます。</p><ul><li>最低1個のコマを割り当てたアクションだけ実行できます。</li><li>アクション値＝割当コマ数＋恒久ボーナス。</li><li>建設と十字軍は1ターンにつき各1回まで。</li></ul></div>
                <div class="manual-section"><h3>移動</h3><p>移動力は複数の騎士へ振り分け可能。通常の隣接移動は1、異教徒がいるマスから出る移動は2を消費します。移動力を残して終了できます。</p></div>
                <div class="manual-section"><h3>十字軍</h3><p>騎士と同じマスの異教徒1体を撃破します。サラセン人は戦力6。プロイセン人・スラブ人は3から始まり、その民族が撃破されるたび盤上の同民族戦力が+1。</p><p>サラセン人撃破後は「3勝利点」または印刷された無料建設／軍隊ボーナスのどちらかを選択します。</p></div>
                <div class="manual-section"><h3>建設</h3><p>自分の騎士がいて、異教徒も建物もないマスに建設できます。各建物は左から順に建設し、マップのコスト軽減・建設時勝利点ボーナスも適用します。</p></div>
                <div class="manual-section"><h3>招集</h3><p>軍隊タイルを左から順に有効化。タイルの勝利点を得て、有効な軍隊1枚につき軍事力+1。</p></div>
                <div class="manual-section"><h3>影響</h3><p>割当コマ数＋影響力ボーナス分の勝利点を獲得します。</p></div>
                <div class="manual-section"><h3>マスの色</h3><ul><li>白：所属なし</li><li>緑：人間</li><li>黒：BOT</li><li>オレンジ：サラセン人</li><li>青：プロイセン人</li><li>赤：スラブ人</li></ul></div>
                <div class="manual-section"><h3>ゲームモード</h3><p>NEW GAMEから完全ソロ／人間 vs BOT NORMALを選択。対戦では人間が先手・後手を決め、後手がスタートマスを選び、先手は残ったマスから開始します。</p></div>
                <div class="manual-section"><h3>騎士団能力</h3>${orderRows}</div>`;
        }
        manualBtn?.addEventListener("click",()=>{manualContent.innerHTML=buildManualHtml();openInfoModal(manualModal);});
        manualClose?.addEventListener("click",()=>closeInfoModal(manualModal));
        manualModal?.addEventListener("click",e=>{if(e.target===manualModal)closeInfoModal(manualModal);});
        newGameBtn.addEventListener("click",()=>resetGameLog());

        const COLS = 8;
        const ROWS = 6;
        const HEX_SIZE = 30; 
        const HEX_WIDTH = 2 * HEX_SIZE;
        const HEX_HEIGHT = Math.sqrt(3) * HEX_SIZE;
        const X_OFFSET = HEX_WIDTH * 0.75;
        const Y_OFFSET = HEX_HEIGHT;
        
        // 削除マスのリスト
        const removedHexes = [
            // 1列目: 1, 3, 4段目
            {c: 0, r: 0}, {c: 0, r: 2}, {c: 0, r: 3},
            // 2列目: 6段目
            {c: 1, r: 5},
            // 3列目: 1, 2, 6段目
            {c: 2, r: 0}, {c: 2, r: 1}, {c: 2, r: 5},
            // 4列目は削除なし
            // 5列目: 1, 6段目
            {c: 4, r: 0}, {c: 4, r: 5},
            // 6列目: 6段目
            {c: 5, r: 5},
            // 7列目: 1段目
            {c: 6, r: 0},
            // 8列目: 5, 6段目
            {c: 7, r: 4}, {c: 7, r: 5}
        ];

        // 固定ボーナス
        const fixedBonuses = {
            "1,2": "城、農場コスト-1",
            "1,3": "教会、銀行コスト-1",
            "2,3": "城、教会、農場、銀行コスト-1" // 3列目4段目
        };

        // マップ上のボーナスタイル枚数
        function getMapBonusTileCount(col, row) {
            const activeRows = [];
            for (let r = 0; r < ROWS; r++) {
                if (!removedHexes.some(h => h.c === col && h.r === r)) activeRows.push(r);
            }
            const index = activeRows.indexOf(row);
            if (index === -1) return 0;

            // 固定ボーナスの3マスには追加ボーナスタイルを置かない
            if (fixedBonuses[`${col},${row}`]) return 0;

            // ボーナスなし
            if (col === 0 && index === activeRows.length - 2) return 0;
            if (col === 1 && (index === 1 || index === activeRows.length - 1)) return 0;
            if (col === 2 && (index === 0 || index === activeRows.length - 1)) return 0;
            if (col === 3 && (index >= 1 && index <= 3 || index === activeRows.length - 2)) return 0;
            if (col === 4 && index >= activeRows.length - 3) return 0;

            // ボーナスタイル2つ
            if (col === 6 || col === 7) return 2;
            if (col === 5 && index === 0) return 2;

            // それ以外は1つ
            return 1;
        }

        const mapBonusTilePool = [
            "農場、城コスト-1",
            "教会、城コスト-1",
            "銀行コスト-1＆勝利点+1",
            "城勝利点+1",
            "教会コスト-1＆勝利点+1",
            "城コスト-1＆勝利点+1",
            "教会、銀行勝利点+1",
            "銀行コスト-1OR教会勝利点+1",
            "農場コスト-1OR城勝利点+1",
            "農場コスト-1＆勝利点+1",
            "農場勝利点+2",
            "農場、銀行勝利点+1",
            "教会、銀行コスト-1",
            "銀行コスト-1OR城勝利点+1",
            "教会コスト-2",
            "城コスト-2",
            "銀行勝利点+2",
            "銀行コスト-2",
            "教会、城勝利点+1",
            "城、銀行勝利点+1",
            "農場コスト-1OR教会勝利点+1",
            "農場コスト-2",
            "農場コスト-1OR銀行勝利点+1",
            "教会勝利点+2",
            "教会、農場勝利点+1",
            "農場、城勝利点+1",
            "教会、農場コスト-1",
            "城、銀行コスト-1",
            "農場、銀行コスト-1",
            "城コスト-1OR教会勝利点+1"
        ];

        function shuffleArray(array) {
            const result = [...array];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function createMapBonusTileAssignments() {
            const slots = [];
            for (let col = 0; col < COLS; col++) {
                for (let row = 0; row < ROWS; row++) {
                    if (removedHexes.some(h => h.c === col && h.r === row)) continue;
                    const count = getMapBonusTileCount(col, row);
                    for (let i = 0; i < count; i++) {
                        slots.push(`${col},${row}`);
                    }
                }
            }

            const shuffledTiles = shuffleArray(mapBonusTilePool);
            const assignments = {};
            slots.forEach((key, index) => {
                if (!assignments[key]) assignments[key] = [];
                assignments[key].push(shuffledTiles[index] || "未設定");
            });
            return assignments;
        }

        const mapBonusTileAssignments = createMapBonusTileAssignments();

        // 異教徒の生成（4～8列目 = c:3～7）
        const enemyList = [];
        for (let i = 0; i < 8; i++) {
            enemyList.push("サラセン人", "プロイセン人", "スラブ人");
        }
        enemyList.sort(() => Math.random() - 0.5);

        // サラセン人の撃破ボーナス（8つ）
        const saracenBonuses = [
            "軍隊+1", "軍隊+1", 
            "農場+1", "農場+1", 
            "教会+1", "教会+1", 
            "城+1", "銀行+1"
        ];
        saracenBonuses.sort(() => Math.random() - 0.5);

        let enemyIndex = 0;
        let saracenIndex = 0;

        const mapGroup = document.createElementNS(SVG_NS, "g");
        mapGroup.setAttribute("transform", "translate(78, 40)");
        mapSvg.appendChild(mapGroup);

        function positionPopupElement(popupEl, clientX, clientY, offset = 15) {
            const pad = 8;

            // サイズ計測前に一度表示状態にして、実寸で位置決めする。
            const popupWidth = popupEl.offsetWidth || popupEl.getBoundingClientRect().width || 0;
            const popupHeight = popupEl.offsetHeight || popupEl.getBoundingClientRect().height || 0;

            // 基本はカーソル右下。右／下にはみ出す場合は左／上へ反転。
            let left = clientX + offset;
            let top = clientY + offset;

            if (left + popupWidth + pad > window.innerWidth) {
                left = clientX - popupWidth - offset;
            }
            if (top + popupHeight + pad > window.innerHeight) {
                top = clientY - popupHeight - offset;
            }

            // 最終的に必ずビューポート内へ収める。
            left = Math.max(pad, Math.min(left, window.innerWidth - popupWidth - pad));
            top = Math.max(pad, Math.min(top, window.innerHeight - popupHeight - pad));

            popupEl.style.left = `${left}px`;
            popupEl.style.top = `${top}px`;
        }

        function getHexPoints(cx, cy, size) {
            let points = [];
            for (let i = 0; i < 6; i++) {
                let angle_deg = 60 * i;
                let angle_rad = Math.PI / 180 * angle_deg;
                points.push(`${cx + size * Math.cos(angle_rad)},${cy + size * Math.sin(angle_rad)}`);
            }
            return points.join(" ");
        }

        function getHexBonusCount(hexInfo) {
            if (!hexInfo) return 0;
            if (hexInfo.bonus && hexInfo.bonus !== "なし") return 1;
            return Math.min(2, Array.isArray(hexInfo.bonusTileEffects) ? hexInfo.bonusTileEffects.length : 0);
        }

        function renderHexBonusBands(group, cx, cy, hexInfo) {
            if (!group) return;
            group.querySelectorAll(".bonus-band, .bonus-tile-marker, .fixed-bonus-star").forEach(el => el.remove());

            const count = getHexBonusCount(hexInfo);
            if (count <= 0) return;

            // 中央寄せの「引両」風。帯の左右端は六角形の斜辺まで到達させる。
            const bandOffsetY = HEX_SIZE * 0.23;
            const bandHeight = 6;

            const makeBand = (centerY) => {
                const topY = centerY - bandHeight / 2;
                const bottomY = centerY + bandHeight / 2;

                // pointy-top六角形の左右斜辺との交点。
                const halfWidthAtY = (y) => {
                    const dy = Math.abs(y - cy);
                    return HEX_SIZE - dy / Math.sqrt(3);
                };

                const topHalfWidth = halfWidthAtY(topY);
                const bottomHalfWidth = halfWidthAtY(bottomY);

                const band = document.createElementNS(SVG_NS, "polygon");
                band.setAttribute("points", [
                    `${cx - topHalfWidth},${topY}`,
                    `${cx + topHalfWidth},${topY}`,
                    `${cx + bottomHalfWidth},${bottomY}`,
                    `${cx - bottomHalfWidth},${bottomY}`
                ].join(" "));
                band.setAttribute("fill", "#facc15");
                band.setAttribute("stroke", "none");
                band.style.pointerEvents = "none";
                band.classList.add("bonus-band");
                group.appendChild(band);
            };

            if (count === 1) {
                makeBand(cy - bandOffsetY);
            } else {
                makeBand(cy - bandOffsetY);
                makeBand(cy + bandOffsetY);
            }
        }

        const hexGroups = {}; // 座標キー毎のグループ要素保持用
        const hexInfos = {};  // マスごとの詳細情報保持用
        let playerPosition = null; // プレイヤーの現在地 {c, r}
        let isSelectingStart = false; // スタート位置選択中フラグ

        let globalDefeated = { "サラセン人": 0, "プロイセン人": 0, "スラブ人": 0 };

        function getEnemyStrength(faction) {
            if (faction === "サラセン人") return 6;
            if (faction === "プロイセン人") return 3 + (globalDefeated["プロイセン人"] || 0);
            if (faction === "スラブ人") return 3 + (globalDefeated["スラブ人"] || 0);
            return 0;
        }

        const affiliationColors = {
            "なし": "#f8fafc",
            "プレイヤー": "#22c55e",
            "ボット": "#020617",
            "サラセン人": "#f97316",
            "プロイセン人": "#2563eb",
            "スラブ人": "#dc2626"
        };

        function getCurrentAffiliation() {
            return playerController === "bot-normal" ? "ボット" : "プレイヤー";
        }

        function updateMapBuildingLabelColor(hexKey) {
            const info = hexInfos[hexKey];
            const group = hexGroups[hexKey];
            if (!info || !group) return;
            const color = info.affiliation === "ボット" ? "#ffffff" : "#000000";
            group.querySelectorAll(".map-building-label, .building-label").forEach(el => {
                el.setAttribute("fill", color);
            });
        }

        function updateHexAffiliationVisual(hexKey) {
            const info = hexInfos[hexKey];
            const group = hexGroups[hexKey];
            if (!info || !group) return;
            const polygon = group.querySelector("polygon.hex");
            if (!polygon) return;

            let affiliation = info.affiliation || "なし";
            if (["サラセン人", "プロイセン人", "スラブ人"].includes(info.faction)) {
                affiliation = info.faction;
            } else if (info.building && info.building !== "空白") {
                affiliation = info.affiliation === "ボット" ? "ボット" : "プレイヤー";
            } else if (affiliation !== "ボット" && affiliation !== "プレイヤー") {
                affiliation = "なし";
            }

            info.affiliation = affiliation;
            polygon.style.fill = affiliationColors[affiliation] || affiliationColors["なし"];
            updateMapBuildingLabelColor(hexKey);
        }

        function setHexAffiliation(hexKey, affiliation) {
            const info = hexInfos[hexKey];
            if (!info) return;
            info.affiliation = affiliation;
            updateHexAffiliationVisual(hexKey);
        }

        for (let col = 0; col < COLS; col++) {
            for (let row = 0; row < ROWS; row++) {
                if (removedHexes.some(h => h.c === col && h.r === row)) continue;

                const cx = col * X_OFFSET;
                let cy = row * Y_OFFSET;
                if (col % 2 !== 0) cy += Y_OFFSET / 2;

                const group = document.createElementNS(SVG_NS, "g");
                const posKey = `${col},${row}`;
                hexGroups[posKey] = group;
                
                const polygon = document.createElementNS(SVG_NS, "polygon");
                polygon.setAttribute("points", getHexPoints(cx, cy, HEX_SIZE));
                polygon.classList.add("hex");
                polygon.addEventListener("click", (e) => {
                    if (!isSelectingMove || !selectedMoveKnight) return;
                    if (!polygon.classList.contains("selectable")) return;
                    e.stopPropagation();
                    executeSelectedKnightMove(col, row);
                });
                group.appendChild(polygon);

                let hexInfo = {
                    faction: "なし",
                    affiliation: "なし",
                    building: "空白",
                    bonus: "なし",
                    bonusTiles: getMapBonusTileCount(col, row),
                    bonusTileEffects: mapBonusTileAssignments[posKey] ? [...mapBonusTileAssignments[posKey]] : [],
                    memo: ""
                };
                hexInfos[posKey] = hexInfo;

                if (fixedBonuses[posKey]) {
                    hexInfo.bonus = fixedBonuses[posKey];
                }
                renderHexBonusBands(group, cx, cy, hexInfo);

                if (col >= 3) {
                    const enemyType = enemyList[enemyIndex++];
                    hexInfo.faction = enemyType;
                    hexInfo.affiliation = enemyType;
                    
                    const circle = document.createElementNS(SVG_NS, "circle");
                    circle.setAttribute("cx", cx);
                    circle.setAttribute("cy", cy);
                    circle.setAttribute("r", 13);
                    
                    const text = document.createElementNS(SVG_NS, "text");
                    text.setAttribute("x", cx);
                    text.setAttribute("y", cy + 4);
                    text.setAttribute("font-size", "12px");
                    text.setAttribute("font-weight", "bold");
                    text.setAttribute("text-anchor", "middle");
                    text.style.pointerEvents = "none";

                    if (enemyType === "サラセン人") {
                        circle.setAttribute("fill", "#eab308");
                        text.setAttribute("fill", "#000");
                        text.textContent = "サ";
                        const bonus = saracenBonuses[saracenIndex++];
                        hexInfo.memo = `【撃破ボーナス】\n${bonus}`;
                    } else if (enemyType === "プロイセン人") {
                        circle.setAttribute("fill", "#3b82f6");
                        text.setAttribute("fill", "#fff");
                        text.textContent = "プ";
                    } else if (enemyType === "スラブ人") {
                        circle.setAttribute("fill", "#ef4444");
                        text.setAttribute("fill", "#fff");
                        text.textContent = "ス";
                    }
                    
                    circle.style.pointerEvents = "none";
                    circle.classList.add("enemy-token");
                    text.classList.add("enemy-label");
                    group.appendChild(circle);
                    group.appendChild(text);
                }

                // ヘックスのクリックイベント（スタート位置選択や将来の移動用）
                updateHexAffiliationVisual(posKey);

                group.addEventListener("click", () => {
                    if (isSelectingStart) {
                        // 2列目の3段目 (c:1, r:2) または 4段目 (c:1, r:3) のみ選択可能
                        if (col === 1 && (row === 2 || row === 3)) {
                            completeStartPositionSelection(col, row);
                        }
                        return;
                    }

                    if (isSelectingCrusade) {
                        const polygon = group.querySelector("polygon");
                        if (!polygon || !polygon.classList.contains("selectable")) return;

                        const targetKey = `${col},${row}`;
                        const targetInfo = hexInfos[targetKey];
                        if (!targetInfo || targetInfo.faction === "なし") return;

                        const enemyType = targetInfo.faction;
                        const enemyStrength = getEnemyStrength(enemyType);
                        if (availableCrusadePoints < enemyStrength) {
                            isSelectingCrusade = false;
                            clearSelectableHexes();
                            messageEl.style.color = "#f87171";
                            messageEl.textContent = `十字軍アクションは不発です（必要戦力: ${enemyStrength}, 戦力: ${availableCrusadePoints}）。`;
                            return;
                        }

                        const gainedVp = enemyType === "サラセン人" ? 0 : enemyStrength;
                        availableCrusadePoints = Math.max(0, availableCrusadePoints - enemyStrength);
                        if (gainedVp > 0) addVictoryPoints(gainedVp);
                        playerResources.defeated[enemyType]++;
                        globalDefeated[enemyType]++;

                        const enemyCircle = group.querySelector("circle");
                        if (enemyCircle) enemyCircle.remove();
                        const enemyText = Array.from(group.querySelectorAll("text")).find(el => ["サ", "プ", "ス"].includes(el.textContent));
                        if (enemyText) enemyText.remove();

                        targetInfo.faction = "なし";
                        targetInfo.affiliation = "なし";
                        updateHexAffiliationVisual(targetKey);
                        isSelectingCrusade = false;
                        clearSelectableHexes();
                        updateStatusUI();
                        if (enemyType === "サラセン人") {
                            resolveSaracenDefeatChoice(targetKey, targetInfo, "サラセン人を撃破しました。");
                        } else {
                            continueCombinedAction(`${enemyType}を撃破しました。勝利点+${gainedVp}。`);
                        }
                        return;
                    }

                    if (isSelectingMove) {
                        if (!selectedMoveKnight) return;
                        const polygon = group.querySelector("polygon");
                        if (!polygon || !polygon.classList.contains("selectable")) return;
                        executeSelectedKnightMove(col, row);
                    }
                });

                group.addEventListener("mousemove", (e) => {
                    tooltip.style.display = "block";
                    const strengthLine = hexInfo.faction !== "なし"
                        ? `<br><strong>戦力:</strong> ${getEnemyStrength(hexInfo.faction)}`
                        : "";
                    const bonusContents = [];
                    if (hexInfo.bonus && hexInfo.bonus !== "なし") {
                        bonusContents.push(hexInfo.bonus);
                    }
                    if (hexInfo.bonusTileEffects && hexInfo.bonusTileEffects.length > 0) {
                        bonusContents.push(...hexInfo.bonusTileEffects);
                    }
                    const bonusLine = bonusContents.length > 0
                        ? `<strong>ボーナス:</strong><br><span style="color:#c084fc;">${bonusContents.join("<br>")}</span>`
                        : `<strong>ボーナス:</strong> なし`;
                    tooltip.innerHTML = `
                        <strong>所属:</strong> ${hexInfo.affiliation}${strengthLine}<br>
                        <strong>建物:</strong> ${hexInfo.building}<br>
                        ${bonusLine}
                        ${hexInfo.memo ? `<br><br><span style="color:#fde047;">${hexInfo.memo}</span>` : ""}
                    `;
                    positionPopupElement(tooltip, e.clientX, e.clientY);
                });

                group.addEventListener("mouseleave", () => {
                    tooltip.style.display = "none";
                });

                mapGroup.appendChild(group);
            }
        }

        // プレイヤー駒の描画管理
        let playerTokenElement = null;
        let remainingVictoryPoints = 140;
        let gameEnded = false;
        let gameEndScheduled = false;

        let playerResources = {
            actions: ["移動", "建設", "招集", "移動", "十字軍", "影響"],
            // プレイヤーボードの状態管理（各建物の建設済み段階）
            buildingsBuilt: {
                "軍隊": 0,
                "城": 0,
                "教会": 0,
                "農場": 0,
                "銀行": 0
            },
            victoryPoints: 0,
            defeated: {
                "サラセン人": 0,
                "プロイセン人": 0,
                "スラブ人": 0
            },
            bonuses: {
                move: 0,
                build: 0,
                recruit: 0,
                influence: 0,
                military: 0
            },
            endGameBonuses: {
                castleEnemySet: false,
                farmKnightArmy: false,
                bankLevel4Buildings: false
            }
        };
        let hexBuildings = {}; // 各マスの建築物管理 key: "col,row", value: 建物名 or "空白"
        const extraKnightTokenElements = [];
        const knightPositions = { 1: null, 2: null, 3: null, 4: null };
        const extraKnightByNumber = {};
        let selectedMoveKnight = null;
        let selectedBuildKnight = null;

        function getKnightDisplayOffset(number) {
            const pos = knightPositions[number];
            if (!pos) return { x: 0, y: 0 };

            const occupants = Object.keys(knightPositions)
                .map(Number)
                .filter(n => knightPositions[n] && knightPositions[n].c === pos.c && knightPositions[n].r === pos.r)
                .sort((a, b) => a - b);

            if (occupants.length <= 1) return { x: 0, y: 0 };

            const index = occupants.indexOf(number);
            if (occupants.length === 2) {
                return index === 0 ? { x: -10, y: 0 } : { x: 10, y: 0 };
            }

            const offsets = occupants.length >= 4
                ? [
                    { x: -9, y: -9 },
                    { x: 9, y: -9 },
                    { x: -9, y: 9 },
                    { x: 9, y: 9 }
                ]
                : [
                    { x: 0, y: -10 },
                    { x: -10, y: 9 },
                    { x: 10, y: 9 }
                ];
            return offsets[index] || { x: 0, y: 0 };
        }

        function updateKnightTokenPositions() {
            const updateGroup = (number, group) => {
                if (!group || !knightPositions[number]) return;
                const pos = knightPositions[number];
                const offset = getKnightDisplayOffset(number);
                const cx = pos.c * X_OFFSET + offset.x;
                let cy = pos.r * Y_OFFSET;
                if (pos.c % 2 !== 0) cy += Y_OFFSET / 2;
                cy += offset.y;

                const circles = group.querySelectorAll("circle");
                circles.forEach(circle => {
                    circle.setAttribute("cx", cx);
                    circle.setAttribute("cy", cy);
                });
                const text = group.querySelector("text");
                if (text) {
                    text.setAttribute("x", cx);
                    text.setAttribute("y", cy + 4);
                }
            };

            updateGroup(1, playerTokenElement);
            updateGroup(2, extraKnightByNumber[2]);
            updateGroup(3, extraKnightByNumber[3]);
            updateGroup(4, extraKnightByNumber[4]);
        }

        function getKnightElement(number) {
            return number === 1 ? playerTokenElement : extraKnightByNumber[number];
        }

        function clearKnightActionHighlights() {
            Object.keys(knightPositions).map(Number).forEach(number => {
                const group = getKnightElement(number);
                if (group) group.classList.remove("knight-action-highlight");
            });
        }

        function highlightKnightNumbers(numbers) {
            clearKnightActionHighlights();
            numbers.forEach(number => {
                const group = getKnightElement(number);
                if (group) group.classList.add("knight-action-highlight");
            });
        }

        function highlightKnightsForMove() {
            const eligible = Object.entries(knightPositions)
                .filter(([, pos]) => {
                    if (!pos || remainingMovePoints <= 0) return false;
                    const info = hexInfos[`${pos.c},${pos.r}`];
                    const moveCost = info && info.faction !== "なし" ? 2 : 1;
                    return remainingMovePoints >= moveCost;
                })
                .map(([number]) => Number(number));
            highlightKnightNumbers(eligible);
        }

        function highlightKnightsForBuild() {
            const eligible = Object.entries(knightPositions)
                .filter(([, pos]) => {
                    if (!pos) return false;
                    const key = `${pos.c},${pos.r}`;
                    const info = hexInfos[key];
                    const hasBuilding = hexBuildings[key] && hexBuildings[key] !== "空白";
                    const hasEnemy = info && info.faction !== "なし";
                    return !hasBuilding && !hasEnemy;
                })
                .map(([number]) => Number(number));
            highlightKnightNumbers(eligible);
        }

        function highlightKnightsForCrusade() {
            const eligible = Object.entries(knightPositions)
                .filter(([, pos]) => {
                    if (!pos) return false;
                    const info = hexInfos[`${pos.c},${pos.r}`];
                    return info && info.faction !== "なし";
                })
                .map(([number]) => Number(number));
            highlightKnightNumbers(eligible);
        }

        function placeExtraKnightToken(col, row, number) {
            knightPositions[number] = { c: col, r: row };
            if (extraKnightByNumber[number]) {
                extraKnightByNumber[number].remove();
            }

            const cx = col * X_OFFSET;
            let cy = row * Y_OFFSET;
            if (col % 2 !== 0) cy += Y_OFFSET / 2;

            const group = document.createElementNS(SVG_NS, "g");
            group.style.cursor = "pointer";

            const hitArea = document.createElementNS(SVG_NS, "circle");
            hitArea.setAttribute("cx", cx);
            hitArea.setAttribute("cy", cy);
            hitArea.setAttribute("r", 16);
            hitArea.setAttribute("fill", "transparent");
            hitArea.style.pointerEvents = "all";
            hitArea.style.cursor = "pointer";
            hitArea.addEventListener("click", (e) => handleKnightClick(number, e));

            const circle = document.createElementNS(SVG_NS, "circle");
            circle.setAttribute("cx", cx);
            circle.setAttribute("cy", cy);
            circle.setAttribute("r", 12);
            circle.setAttribute("fill", number === 4 ? "#111827" : (playerController === "bot-normal" ? "#020617" : "#22c55e"));
            circle.setAttribute("stroke", "#ffffff");
            circle.setAttribute("stroke-width", "2");
            circle.style.pointerEvents = "none";

            const text = document.createElementNS(SVG_NS, "text");
            text.setAttribute("x", cx);
            text.setAttribute("y", cy + 4);
            text.setAttribute("font-size", "10px");
            text.setAttribute("font-weight", "bold");
            text.setAttribute("fill", "#ffffff");
            text.setAttribute("text-anchor", "middle");
            text.textContent = number === 4 ? "黒騎" : `騎${number}`;
            text.style.pointerEvents = "none";

            group.appendChild(hitArea);
            group.appendChild(circle);
            group.appendChild(text);
            mapGroup.appendChild(group);
            extraKnightByNumber[number] = group;
            if (!extraKnightTokenElements.includes(group)) extraKnightTokenElements.push(group);
            updateKnightTokenPositions();
        }

        function getCastleEndGameBonus() {
            if (!playerResources.endGameBonuses.castleEnemySet) return 0;
            const sets = Math.min(
                playerResources.defeated["サラセン人"],
                playerResources.defeated["プロイセン人"],
                playerResources.defeated["スラブ人"]
            );
            return sets * 4;
        }

        function setPlayerPosition(col, row) {
            playerPosition = { c: col, r: row };
            knightPositions[1] = { c: col, r: row };
            if (playerTokenElement) {
                playerTokenElement.remove();
            }

            const cx = col * X_OFFSET;
            let cy = row * Y_OFFSET;
            if (col % 2 !== 0) cy += Y_OFFSET / 2;

            const pGroup = document.createElementNS(SVG_NS, "g");
            pGroup.style.cursor = "pointer";

            const pHitArea = document.createElementNS(SVG_NS, "circle");
            pHitArea.setAttribute("cx", cx);
            pHitArea.setAttribute("cy", cy);
            pHitArea.setAttribute("r", 16);
            pHitArea.setAttribute("fill", "transparent");
            pHitArea.style.pointerEvents = "all";
            pHitArea.style.cursor = "pointer";
            pHitArea.addEventListener("click", (e) => handleKnightClick(1, e));

            const pCircle = document.createElementNS(SVG_NS, "circle");
            pCircle.setAttribute("cx", cx);
            pCircle.setAttribute("cy", cy);
            pCircle.setAttribute("r", 12);
            pCircle.setAttribute("fill", playerController === "bot-normal" ? "#020617" : "#22c55e");
            pCircle.setAttribute("stroke", "#ffffff");
            pCircle.setAttribute("stroke-width", "2");
            pCircle.style.pointerEvents = "none";

            const pText = document.createElementNS(SVG_NS, "text");
            pText.setAttribute("x", cx);
            pText.setAttribute("y", cy + 4);
            pText.setAttribute("font-size", "11px");
            pText.setAttribute("font-weight", "bold");
            pText.setAttribute("fill", "#ffffff");
            pText.setAttribute("text-anchor", "middle");
            pText.textContent = "騎";
            pText.style.pointerEvents = "none";

            pGroup.appendChild(pHitArea);
            pGroup.appendChild(pCircle);
            pGroup.appendChild(pText);
            mapGroup.appendChild(pGroup);
            playerTokenElement = pGroup;
            updateKnightTokenPositions();
        }

        function endMoveAction() {
            clearKnightActionHighlights();
            isSelectingMove = false;
            selectedMoveKnight = null;
            clearSelectableHexes();
            if (!flexibleCombinedMode) remainingMovePoints = 0;
            continueCombinedAction("移動アクションが完了しました。");
        }

        function renderMoveMessage(text) {
            messageEl.style.color = "#facc15";
            messageEl.innerHTML = `${text} ` +
                `<button id="move-cancel-btn" style="margin-left:8px; padding:2px 8px; cursor:pointer;">キャンセル</button>` +
                `<button id="move-finish-btn" style="margin-left:4px; padding:2px 8px; cursor:pointer;">移動終了</button>`;

            document.getElementById("move-cancel-btn").addEventListener("click", () => {
                selectedMoveKnight = null;
                clearSelectableHexes();
                renderMoveMessage(`移動アクション（残り移動力: ${remainingMovePoints}）。移動する騎士コマを選択してください。`);
            });

            document.getElementById("move-finish-btn").addEventListener("click", () => {
                endMoveAction();
            });
        }

        function handleKnightClick(number, e) {
            clearKnightActionHighlights();
            if (e) e.stopPropagation();
            if (!knightPositions[number]) return;

            if (isSelectingBuild) {
                selectedBuildKnight = number;
                playerPosition = { ...knightPositions[number] };
                setInteractionMode("map-board");
                const buildableCount = highlightBuildableTiles();
                if (buildableCount === 0) {
                    messageEl.style.color = "#f87171";
                    messageEl.textContent = `騎士${number}のいるマスでは建設できません。別の騎士コマを選択してください。`;
                } else {
                    messageEl.style.color = "#facc15";
                    messageEl.textContent = `騎士${number}を選択しました。右側のプレイヤーボードから建設する建物をクリックしてください。`;
                }
                return;
            }

            if (isSelectingCrusade) {
                const pos = knightPositions[number];
                const key = `${pos.c},${pos.r}`;
                const info = hexInfos[key];
                if (!info || info.faction === "なし") {
                    messageEl.style.color = "#f87171";
                    messageEl.textContent = `騎士${number}のいるマスには異教徒コマがありません。`;
                    return;
                }
                const enemyType = info.faction;
                const enemyStrength = getEnemyStrength(enemyType);
                if (availableCrusadePoints < enemyStrength) {
                    messageEl.style.color = "#f87171";
                    messageEl.textContent = `戦力が不足しています（必要: ${enemyStrength}, 保持: ${availableCrusadePoints}）。別の騎士コマを選択してください。`;
                    return;
                }
                const gainedVp = enemyType === "サラセン人" ? 0 : enemyStrength;
                availableCrusadePoints = Math.max(0, availableCrusadePoints - enemyStrength);
                if (gainedVp > 0) addVictoryPoints(gainedVp);
                playerResources.defeated[enemyType]++;
                globalDefeated[enemyType]++;
                const group = hexGroups[key];
                const enemyCircle = group ? group.querySelector("circle") : null;
                if (enemyCircle) enemyCircle.remove();
                const enemyText = group ? Array.from(group.querySelectorAll("text")).find(el => ["サ", "プ", "ス"].includes(el.textContent)) : null;
                if (enemyText) enemyText.remove();
                info.faction = "なし";
                info.affiliation = "なし";
                updateHexAffiliationVisual(key);
                isSelectingCrusade = false;
                clearSelectableHexes();
                updateStatusUI();
                if (enemyType === "サラセン人") {
                    resolveSaracenDefeatChoice(key, info, `騎士${number}がサラセン人を撃破しました。`);
                } else {
                    continueCombinedAction(`騎士${number}が${enemyType}を撃破しました。勝利点+${gainedVp}。`);
                }
                return;
            }

            if (!isSelectingMove) return;

            if (selectedMoveKnight === number) {
                messageEl.style.color = "#facc15";
                messageEl.innerHTML = `まだ移動力が${remainingMovePoints}残っていますが移動を終了しますか？ ` +
                    `<button id="move-end-ok" style="margin-left:8px; padding:2px 8px; cursor:pointer;">OK</button>` +
                    `<button id="move-end-cancel" style="margin-left:4px; padding:2px 8px; cursor:pointer;">キャンセル</button>`;
                document.getElementById("move-end-ok").addEventListener("click", () => { endMoveAction(); });
                document.getElementById("move-end-cancel").addEventListener("click", () => {
                    highlightMoveableHexes();
                    renderMoveMessage(`騎士${number}を選択しました。移動先の隣接マスを選択してください。残り移動力: ${remainingMovePoints}`);
                });
                return;
            }
            selectedMoveKnight = number;
            playerPosition = { ...knightPositions[number] };
            highlightMoveableHexes();
            renderMoveMessage(`騎士${number}を選択しました。移動先の隣接マスを選択してください。残り移動力: ${remainingMovePoints}`);
        }

        function executeSelectedKnightMove(col, row) {
            if (!isSelectingMove || !selectedMoveKnight) return false;
            const destinationKey = `${col},${row}`;
            const destinationPolygon = hexGroups[destinationKey]?.querySelector("polygon");
            if (!destinationPolygon || !destinationPolygon.classList.contains("selectable")) return false;
            const movingKnight = selectedMoveKnight;
            const currentPos = knightPositions[movingKnight];
            if (!currentPos) return false;
            const currentInfo = hexInfos[`${currentPos.c},${currentPos.r}`];
            const moveCost = currentInfo && currentInfo.faction !== "なし" ? 2 : 1;
            if (remainingMovePoints < moveCost) return false;

            remainingMovePoints -= moveCost;
            moveSelectedKnightTo(col, row);

            if (gameMode === "versus" && playerStates[currentPlayerIndex]) {
                playerStates[currentPlayerIndex].knightPositions = structuredClone(knightPositions);
            }

            selectedMoveKnight = null;
            clearSelectableHexes();
            if (remainingMovePoints > 0) {
                renderMoveMessage(`移動しました。残り移動力: ${remainingMovePoints}。次に移動する騎士コマを選択してください。`);
                highlightKnightsForMove();
            } else {
                endMoveAction();
            }
            return true;
        }

        function moveSelectedKnightTo(col, row) {
            const number = selectedMoveKnight;
            if (!number) return;
            if (number === 1) {
                setPlayerPosition(col, row);
            } else {
                placeExtraKnightToken(col, row, number);
                playerPosition = { c: col, r: row };
            }
        }

        function highlightSelectableStartHexes() {
            // 2列目の3段目 (1,2) と 4段目 (1,3)
            const targetKeys = ["1,2", "1,3"];
            targetKeys.forEach(key => {
                if (hexGroups[key]) {
                    const poly = hexGroups[key].querySelector("polygon");
                    if (poly) poly.classList.add("selectable");
                }
            });
        }

        function clearSelectableHexes() {
            document.querySelectorAll(".hex.selectable").forEach(el => {
                el.classList.remove("selectable");
            });
        }

        function completeStartPositionSelection(col, row) {
            if (gameMode === "versus" && versusSetupPhase === "start-position") {
                const secondIndex=1-firstPlayerIndex;
                finalizeVersusStartPositions(secondIndex,{c:col,r:row});
                return;
            }
            setPlayerPosition(col, row);
            if (selectedKnightOrder === "モンテサ騎士団") {
                placeExtraKnightToken(col, row, 4);
            }
            isSelectingStart = false;
            clearSelectableHexes();
            setInteractionMode("all");

        function startVersusSetup(humanIndex) {
            hideChoiceModal();
            versusHumanIndex=humanIndex;
            firstPlayerIndex=0;
            playerStates=[
                createDefaultPlayerState(humanIndex===0?"human":"bot-normal", humanIndex===0?"人間":"BOT"),
                createDefaultPlayerState(humanIndex===1?"human":"bot-normal", humanIndex===1?"人間":"BOT")
            ];
            remainingVictoryPoints=140; gameEnded=false; gameEndScheduled=false;
            versusSetupPhase="human-order";
            currentPlayerIndex=humanIndex;
            resetGlobalsForPlayerSetup("human");
            messageEl.style.color="#facc15";
            startKnightOrderSelection();
        }

        function beginVersusStartPositionSelection() {
            const secondIndex=1-firstPlayerIndex;
            if (playerStates[secondIndex].controller === "human") {
                loadPlayerState(secondIndex);
                isSelectingStart=true; clearSelectableHexes(); highlightSelectableStartHexes(); setInteractionMode("all");
                messageEl.style.color="#facc15";
                messageEl.textContent="後手の人間プレイヤー：スタートマスを1つ選択してください。先手は残ったマスから開始します。";
            } else {
                loadPlayerState(secondIndex);
                const pos=chooseBotStartPosition();
                finalizeVersusStartPositions(secondIndex,pos);
            }
        }

        function finalizeVersusStartPositions(secondIndex, secondPos) {
            playerStates[secondIndex].knightPositions[1]={...secondPos};
            if (playerStates[secondIndex].selectedKnightOrder === "モンテサ騎士団") playerStates[secondIndex].knightPositions[4]={...secondPos};
            const starts=[{c:1,r:2},{c:1,r:3}];
            const firstPos=starts.find(p=>p.c!==secondPos.c || p.r!==secondPos.r);
            playerStates[firstPlayerIndex].knightPositions[1]={...firstPos};
            if (playerStates[firstPlayerIndex].selectedKnightOrder === "モンテサ騎士団") playerStates[firstPlayerIndex].knightPositions[4]={...firstPos};
            versusSetupPhase=null; isSelectingStart=false; clearSelectableHexes();
            loadPlayerState(firstPlayerIndex);
            messageEl.style.color="#4ade80";
            messageEl.textContent=`ゲーム開始。先手：${playerStates[firstPlayerIndex].name}、後手：${playerStates[secondIndex].name}。`;
            startCurrentPlayerTurn(220);
        }

        function startPositionSelection() {
            // 騎士団固有の初期ホイール設定はここで必ず終了させる。
            // 対戦セットアップでは途中 return があるため、ここより後で解除すると
            // hospital-token 等が次の通常ウェッジクリックまで残ってしまう。
            knightOrderSetupMode = null;
            knightOrderSetupSelections = [];

            if (gameMode === "versus" && versusSetupPhase === "human-order") {
                saveSetupStateFor(versusHumanIndex);
                versusSetupPhase = "bot-order";
                const botIndex=1-versusHumanIndex;
                resetGlobalsForPlayerSetup("bot-normal");
                currentPlayerIndex=botIndex;
                playerStates[botIndex].controller="bot-normal";
                botAutoSetup();
                return;
            }
            if (gameMode === "versus" && versusSetupPhase === "bot-order") {
                const botIndex=1-versusHumanIndex;
                saveSetupStateFor(botIndex);
                versusSetupPhase = "start-position";
                beginVersusStartPositionSelection();
                return;
            }
            isSelectingStart = true;
            isSelectingMove = false;
            selectedMoveKnight = null;
            isSelectingBuild = false;
            if (playerTokenElement) {
                playerTokenElement.remove();
                playerTokenElement = null;
            }
            clearSelectableHexes();
            highlightSelectableStartHexes();
            setInteractionMode("all");
            messageEl.style.color = "#facc15";
